      ${breaches.length ? `<div class="banner-warn" style="margin:0"><span class="small"><b>Above appetite</b> for ${breaches.map(a => `${a.d.toLowerCase()} (${a.level.toLowerCase()}: ${a.worst.toLowerCase()} or below)`).join(' and ')}. ${r.responses.some(x => x.s === 'Accept') ? 'Accepting it needs a benefit-risk analysis (ISO 14971 §7.4) and Product Security at the root OU.' : 'The planned responses bring it to the target.'}</span></div>` : ''}
      <div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">${ratingBox('Inherent', r.inh, 'Not rated yet')}${ratingBox('Residual', r.res, 'Rated after responses are in place')}${ratingBox('Target', r.tgt, 'Not set')}</div>
      <div><div class="card-head" style="margin-bottom:6px"><h2>Responses</h2>${canAssess() ? '<button class="btn plain" data-toast="Add response: pick a strategy (reduce, avoid, share or accept) and the controls that carry it out.">Add response</button>' : ''}</div>
        ${r.responses.length ? `<div class="tablewrap"><table><thead><tr><th>Strategy</th><th>Description</th><th>Status</th><th>Owner</th></tr></thead><tbody>${r.responses.map(x => `<tr><td><span class="tag">${x.s}</span></td><td>${x.d}${x.cm ? `<div class="small muted">Control: ${x.cm}</div>` : ''}</td><td>${pill(x.st)}</td><td class="small">${x.owner}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty" style="padding:12px">No responses yet.</div>'}
      </div>
    </div>`;
  }

  function riskAssessmentPage(e, i) {
    const modelEngagement = threatModelFor(e.item); const model = modelEngagement && TMS[modelEngagement.id];
    const register = RISKS.filter(r => r.item === e.item);
    const selected = register.find(r => r.id === state.riskId) || register[0];
    const covered = new Set(register.flatMap(r => r.thr));
    const uncovered = model ? model.threats.filter(t => !covered.has(t.id)) : [];
    const signed = e.status === 'Approved' || e.status === 'Review overdue';
    const now = conclusionNow(register);
    const usedDamage = [...new Set([...register.flatMap(r => r.ds), ...(model ? model.threats.flatMap(t => t.ds) : [])])].sort();
    const table = `<div class="tablewrap"><table><thead><tr><th style="min-width:200px">Risk</th><th>Inherent</th><th>Residual</th><th>Target</th><th>Status</th><th>Impact from</th></tr></thead><tbody>${register.map(r => `<tr class="click ${selected && r.id === selected.id ? 'sel' : ''}" data-risksel="${r.id}"><td><span class="mono">${r.id}</span> <b>${r.t}</b><div class="small muted">${riskOrigin(r)}</div>${r.reqs.length ? reqStrip('Creates requirement', r.reqs[0], r.reqs.length > 1 ? ` <span class="muted">+${r.reqs.length - 1} more</span>` : '') : ''}</td><td>${ratingPill(r.inh)}</td><td>${ratingPill(r.res)}${appetiteBreaches(r).length ? '<div class="small" style="color:var(--bad)">above appetite</div>' : ''}</td><td>${ratingPill(r.tgt)}</td><td>${pill(r.st)}</td><td>${dsCategoryPills(r.ds)}</td></tr>`).join('')}</tbody></table></div>`;
    const board = `<div class="board">${RISK_STATUSES.map(s => { const cards = register.filter(r => r.st === s); return `<div class="board-col"><div class="small" style="display:flex;justify-content:space-between"><b>${s}</b><span class="muted">${cards.length}</span></div>${cards.map(r => `<div class="risk-card ${selected && r.id === selected.id ? 'sel' : ''}" data-risksel="${r.id}"><span class="small muted mono">${r.id}</span><b>${r.t}</b><span>${ratingPill(r.inh)}</span><span>${dsCategoryPills(r.ds)}</span></div>`).join('')}</div>`; }).join('')}</div>`;
    return `<div class="small"><a href="#engagements">Engagements</a> › ${e.name}</div>
    <div class="page-head"><div><h1>${e.name}</h1><p class="sub">Risk assessment · <a href="#item-${i.id}">${itemPath(i.id)}</a> · owned by ${OUS[i.owner].name}</p></div>${pill(e.status)}</div>
    <div class="grid g2"><section class="card"><dl class="kv"><dt>Scope</dt><dd>${i.name} (${i.type}${i.cls ? ', ' + i.cls : ''})</dd>
      <dt>Type</dt><dd>${(e.kinds || ['Security']).join(', ')}</dd>
      <dt>Cadence</dt><dd>${e.cadence || '—'}${e.trigger ? `<div class="small muted">Triggered by: ${e.trigger}</div>` : ''}</dd>
      <dt>Assessors</dt><dd class="small">${(e.assessors || []).join('<br>')}</dd>
      <dt>Threats from</dt><dd>${modelEngagement ? `<a href="#eng-${modelEngagement.id}">${modelEngagement.name}</a> ${pill(modelEngagement.status)}` : 'No threat model yet'}</dd>
      <dt>Method</dt><dd>Qualitative matrix: 6 likelihood levels × 5 impact levels (AAMI TIR57 scales)</dd>
      ${e.supersedes ? `<dt>Supersedes</dt><dd>${e.supersedes} ${pill('Superseded')}</dd>` : ''}</dl></section>
    <section class="card"><dl class="kv"><dt>Overall risk</dt><dd>${lvlPill(overallRisk(register))} <span class="small muted">highest residual rating</span></dd>
      <dt>Sign-off</dt><dd>${signed ? `E-signed by ${e.signer || 'Ben Okafor'} (Product Security) on ${e.date}. Meaning: approval` : 'Not yet signed off'}</dd>
      ${signed && e.conclusion ? `<dt>Conclusion at sign-off</dt><dd>${pill(e.conclusion)}</dd>` : ''}
      <dt>Conclusion today</dt><dd>${pill(now.verdict)}${now.reasons.length ? `<div class="small muted">${now.reasons.join('<br>')}</div>` : ''}</dd>
      <dt>Next review</dt><dd>${e.next}</dd></dl></section></div>
    <p class="note-box" style="margin:0">Threat modeling found what can go wrong. This assessment decides how likely and how bad each risk is, who owns it, and whether to reduce, share, avoid or accept it. Each risk takes its likelihood from threat scenarios and its impact from damage scenarios. Signing it produces the security risk management report (AAMI SW96) for the design history file and the premarket submission.</p>
    <section class="card"><div class="card-head" style="flex-wrap:wrap"><div><h2>Risk register</h2><span class="small muted">Security risks to ${i.name}. Kept on the product, so the next assessment starts from here.</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select disabled title="Fixed once the register has risks, as today" style="font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-alt)"><option>Qualitative matrix</option></select><div class="chips"><button class="chip ${state.riskView === 'table' ? 'on' : ''}" data-riskview="table">Table</button><button class="chip ${state.riskView === 'board' ? 'on' : ''}" data-riskview="board">Board</button></div>${canAssess() ? `<button class="btn" data-addrisk="${e.item}">Add risk</button>` : ''}</div></div>
      ${register.length ? `<div class="risk-layout"><div style="min-width:0">${state.riskView === 'board' ? board : table}</div><div class="cm-card" style="padding:0">${selected ? riskDetail(selected) : ''}</div></div>` : '<div class="empty">No risks yet. Start from the threats below.</div>'}
    </section>
    <div class="grid g2">
    <section class="card"><div class="card-head"><div><h2>Damage scenarios</h2><span class="small muted">The outcomes these risks and threats can lead to, from the shared library. Engineers link threats to them; Product Security rates each impact there.</span></div><a class="btn ghost" href="#libraries">Open the library</a></div>
      <div class="tablewrap"><table><thead><tr><th>Damage scenario</th><th>Impact</th><th>Used by</th></tr></thead><tbody>${usedDamage.map(id => { const risksUsing = register.filter(r => r.ds.includes(id)).map(r => r.id); const threatsUsing = model ? model.threats.filter(t => t.ds.includes(id)).length : 0;
        return `<tr><td><span class="mono small">${id}</span> <b>${DAMAGE[id].n}</b><div class="small muted">${DAMAGE[id].d} Affects: ${DAMAGE[id].affects.toLowerCase()}.</div><div class="small muted">From ${DAMAGE[id].from}</div></td><td>${DAMAGE[id].impacts.map(impact => `<div><span class="pill ${categoryClass(impact[0])}">${impactText(impact)}</span></div>`).join('')}</td><td class="small">${risksUsing.join(', ') || '—'}${threatsUsing ? `<div class="muted">${threatsUsing} threat${threatsUsing === 1 ? '' : 's'}</div>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="3" class="empty">None yet.</td></tr>'}</tbody></table></div></section>
    <section class="card"><div class="card-head"><div><h2>Risk appetite</h2><span class="small muted">${APPETITE.statement}. Set by ${APPETITE.owner} on ${APPETITE.approved}; next review ${APPETITE.next}.</span></div></div>
      <div class="tablewrap"><table><thead><tr><th>Domain</th><th>Appetite</th><th>Acceptable residual</th><th>Above it now</th></tr></thead><tbody>${APPETITE.domains.map(a => { const above = register.filter(r => appetiteBreaches(r).includes(a)).map(r => r.id); return `<tr><td><b>${a.d}</b></td><td>${a.level}</td><td>${lvlPill(a.worst)} or below</td><td>${above.length ? `<span class="pill p-bad">${above.join(', ')}</span>` : '<span class="muted small">None</span>'}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="small muted" style="margin:10px 0 0">A risk above its appetite needs responses that reach the target, or a benefit-risk analysis to accept it.</p></section>
    </div>
    ${model ? `<section class="card"><div class="card-head"><div><h2>Threats not yet linked to a risk</h2><span class="small muted">From ${modelEngagement.name}. Not every threat needs its own risk: low ones can stay with their countermeasure.</span></div></div>${uncovered.length ? `<div class="list">${uncovered.map(t => `<div class="row-item"><div class="main"><span class="small muted"><a href="#eng-${modelEngagement.id}~threats~${t.id}">${t.id}</a> · ${tmTargetLabel(model, t.target)}</span><b>${t.t}</b>${t.ds.length ? `<span>${dsPills(t.ds)}</span>` : ''}</div><div class="acts">${t.st === 'Open' ? '<span class="pill p-bad">exposed</span>' : pill(t.st)}${canAssess() ? `<button class="btn plain" data-addrisk="${e.item}" data-threat="${t.id}">Raise risk</button>` : ''}</div></div>`).join('')}</div>` : '<div class="empty">Every threat is linked to a risk.</div>'}</section>` : ''}
    <section class="card review-bar"><div class="small" style="max-width:70ch">${signed ? 'Signed. Risks added or changed since then show in the register and go into the next review.' : 'Product Security signs off with a conclusion: acceptable, unacceptable or inconclusive.'}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn plain" data-toast="Security risk management report (AAMI SW96) generated from the ${signed ? 'signed snapshot' : 'current register'} (prototype: no file).">Generate SW96 report</button>${!signed ? (has('Product Security') ? `<button class="btn" data-rasign="${e.id}">Sign off</button>` : '<span class="small muted" style="align-self:center">Only Product Security can sign off.</span>') : ''}</div></section>`;
  }

  // ---------- Signed versions for Regulatory Affairs: read only, no drafts. Reached from the evidence on the Submissions tab ----------
  // The approved version of a threat model: without the threats, flows and components added since approval, and with changed flows as they were.
  function signedVersion(tm) {
    const added = new Set((tm.changes || []).filter(c => c.change === 'Added').map(c => c.id));
    const addedNodes = new Set(tm.changedNodes || []);
    const previous = Object.fromEntries((tm.changes || []).filter(c => c.previous).map(c => [c.id, c.previous]));
    return { ...tm, threats: tm.threats.filter(t => !added.has(t.id)), flows: tm.flows.filter(f => !added.has(f.id)).map(f => previous[f.id] ? { ...f, ...previous[f.id] } : f), nodes: tm.nodes.filter(n => !addedNodes.has(n.id)), changes: null };
  }
  function signedEngagement(e, i) {
    const head = `<div class="small"><a href="#item-${i.id}">${itemPath(i.id)}</a> › ${e.name}</div><div class="page-head"><div><h1>${e.name}</h1><p class="sub">${e.type} · ${i.name} · signed version, read only</p></div><div style="display:flex;gap:8px;align-items:center">${pill(e.status)}${e.type === 'Threat model' && TMS[e.id] && TMS[e.id].ver ? `<button class="btn plain" data-tmexport="${e.id}">Export</button>` : ''}</div></div>`;
    if (e.type === 'Threat model') {
      const tm = TMS[e.id];
      if (!tm || !tm.ver) return `${head}<section class="card empty">No version has been approved yet, so there is nothing to show. Regulatory Affairs sees a threat model once a version is signed. ${e.next}.</section>`;
      const signed = signedVersion(tm);
      return `${head}<p class="note-box" style="margin:0">Read only. You see version ${tm.ver}, approved by ${tm.approvedBy.replace(/ \(.*\)$/, '')}.${tm.working ? ` Version ${tm.working} is in progress and appears here once it is signed.` : ''} Regulatory Affairs sees signed versions only.</p>
      <section class="card"><div class="card-head"><h2>Security architecture</h2><span class="small muted">${signed.zones.length} trust zones · ${signed.nodes.length} nodes · ${signed.flows.length} data flows</span></div><div class="dfd-wrap">${dfdSvg(signed, [])}</div></section>
      <section class="card"><div class="card-head"><h2>Traceability: threat › requirement › countermeasure › evidence</h2><span class="small muted">${signed.threats.length} threats</span></div>${traceabilityTable(signed, false)}</section>
      <section class="card"><div class="card-head"><h2>Assumptions</h2></div><div class="tablewrap"><table><thead><tr><th>Assumption</th><th>Validity</th><th>How it was checked</th></tr></thead><tbody>${signed.assumptions.map(a => `<tr><td>${a.a}</td><td>${pill(a.v)}</td><td class="small muted">${a.how}</td></tr>`).join('')}</tbody></table></div></section>`;
    }
    const signedOff = e.status === 'Approved' || e.status === 'Review overdue';
    if (!signedOff) return `${head}<section class="card empty">This assessment has not been signed off yet, so there is nothing to show. ${e.next}.</section>`;
    const register = RISKS.filter(r => r.item === e.item && r.review !== 'Added after sign-off');
    return `${head}<p class="note-box" style="margin:0">Read only. You see the assessment as signed off on ${e.date}. Risks added since then appear at the next sign-off.</p>
    <section class="card"><dl class="kv"><dt>Type</dt><dd>${(e.kinds || ['Security']).join(', ')}</dd><dt>Cadence</dt><dd>${e.cadence || '—'}</dd><dt>Assessors</dt><dd class="small">${(e.assessors || []).join('<br>')}</dd><dt>Method</dt><dd>Qualitative matrix on AAMI TIR57 scales</dd><dt>Signed off</dt><dd>By ${e.signer || 'Ben Okafor'} (Product Security) on ${e.date}</dd><dt>Conclusion</dt><dd>${pill(e.conclusion || 'Inconclusive')}</dd><dt>Overall risk</dt><dd>${lvlPill(overallRisk(register))} <span class="small muted">highest residual rating</span></dd><dt>Next review</dt><dd>${e.next}</dd></dl></section>
    <section class="card"><div class="card-head"><h2>Risks</h2></div><div class="tablewrap"><table><thead><tr><th>Risk</th><th>Impact from</th><th>Inherent</th><th>Residual</th><th>Target</th><th>Responses</th></tr></thead><tbody>${register.map(r => `<tr class="${r.id === state.riskId ? 'sel' : ''}"><td><span class="mono">${r.id}</span> <b>${r.t}</b>${r.pending ? `<div>${pill(r.pending)}</div>` : ''}${r.reqs.length ? `<div>${reqStrip('Creates requirement', r.reqs.join('; '))}</div>` : ''}</td><td>${dsPills(r.ds)}</td><td>${ratingPill(r.inh)}</td><td>${ratingPill(r.res)}</td><td>${ratingPill(r.tgt)}</td><td class="small">${r.responses.map(x => `${x.s}: ${x.d}`).join('<br>') || '—'}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="card review-bar"><div class="small">The signed snapshot is the AAMI SW96 security risk management report.</div><button class="btn plain" data-toast="Security risk management report (AAMI SW96) generated from the signed snapshot (prototype: no file).">Generate SW96 report</button></section>`;
  }

  // Pen tests are their own engagement. The threat model only shows what they say about the model.
  function pentestFeedbackCard(e, i, tm) {
    const tests = ENGAGEMENTS.filter(x => x.type === 'Pen test' && x.item === e.item && x.status !== 'Planned');
    if (!tests.length) return '';
    const findings = FINDINGS.filter(f => tests.some(t => t.id === f.test));
    const threatIds = new Set(tm.threats.map(t => t.id));
    const predicted = findings.filter(f => f.thr && threatIds.has(f.thr));
    const missed = findings.filter(f => !f.thr || !threatIds.has(f.thr));
    return `<section class="card"><div class="card-head"><div><h2>Pen test feedback</h2><span class="small muted">${predicted.length} of ${findings.length} findings were predicted by this threat model</span></div><a class="btn ghost" href="#eng-${tests[0].id}">Open ${tests[0].name}</a></div>
      ${missed.length ? `<div class="list">${missed.map(f => `<div class="row-item"><div class="main"><span class="small muted">${f.id} · ${lvlPill(f.sev)} · CVSS ${f.cvss}</span><b>${f.t}</b><span class="small" style="color:var(--warn)">Not in the model: a gap to close</span></div><div class="acts">${canPropose() ? `<button class="btn plain" data-addthreat="${f.id}">Add as threat</button>` : ''}</div></div>`).join('')}</div>` : '<div class="small muted">Every finding is linked to a threat.</div>'}</section>`;
  }

  function portfolio() {
    const set = scopeSet(); const own = new Set(itemsIn(set).map(i => i.id));
    const show = new Set(); own.forEach(id => { let c = ITEM[id]; while (c) { show.add(c.id); c = c.parent ? ITEM[c.parent] : null; } });
    const ordered = []; const walk = (pid, d) => ITEMS.filter(i => i.parent === pid).forEach(i => { if (show.has(i.id)) { ordered.push([i, d]); walk(i.id, d + 1); } }); walk(null, 0);
    return `<div class="page-head"><div><h1>Portfolio</h1><p class="sub">Devices and software items in scope. Item types are set by your admin; each item has one owning OU and optional contributor OUs.</p></div></div>
    <section class="card">${!ordered.length ? `<div class="empty">No portfolio items in this scope.</div>` : `<div class="tablewrap"><table><thead><tr><th>Item</th><th>Owning OU</th><th>Contributors</th><th>Safety class</th><th>Markets</th><th>Threat model</th><th class="num">Open req.</th></tr></thead><tbody>${ordered.map(([i, d]) => `<tr class="click ${own.has(i.id) ? '' : 'muted'}" data-item="${i.id}"><td><span class="indent" style="width:${d * 20}px"></span>${d ? '└ ' : ''}<b>${i.name}</b> <span class="type">${i.type}</span>${i.cyber ? ' <span class="tag">Cyber device</span>' : ''}</td><td>${OUS[i.owner].name}</td><td>${i.contrib.map(c => `<span class="tag">${OUS[c].name}</span>`).join('') || '<span class="muted">—</span>'}</td><td>${scLabel(i)}</td><td class="small">${i.markets.join(', ') || '—'}</td><td>${tmPill(i)}</td><td class="num">${holds(i) ? i.open : '—'}</td></tr>`).join('')}</tbody></table></div>`}</section>
    <p class="note-box">Safety class is the IEC 62304 software safety class (A, B or C). A cyber device is one that runs software, connects to the internet and could be vulnerable, as defined in FD&amp;C Act 524B.</p>`;
  }

  function genericReqs(i) {
    const rows = [];
    for (let k = 0; k < Math.min(i.met, 2); k++) rows.push({ t: ['Clinicians sign in with multi-factor authentication (IEC 81001-5-1 §5.2)', 'TLS 1.2 or higher on all external connections'][k], src: [['Pack', k ? 'HIPAA 164.312(e)(1)' : 'IEC 81001-5-1']], ctl: [k ? 'Gateway TLS policy' : 'Clinician identity service MFA'], inh: true, st: 'Met' });
    if (i.prog) rows.push({ t: 'Encrypt PHI at rest', src: [['Threat model', 'T-4']], ctl: ['Encrypted storage'], st: 'In progress' });
    if (i.open) rows.push({ t: 'Clinician sessions lock after 5 minutes idle', src: [['Policy', 'Secure product development procedure §4.2']], ctl: [], st: 'Open' });
    if (i.open > 1) rows.push({ t: i.cyber ? 'Provide a machine-readable SBOM' : 'Log all access to PHI', src: [['Pack', i.cyber ? 'FD&C Act 524B(b)(3)' : 'HIPAA 164.312(b)']], ctl: [], st: 'Open' });
    return rows;
  }
  function packChangeBanner(item) {
    const change = packsToReview(item);
    return change ? `<div class="banner-warn"><span><b>Attributes changed since the packs were last reviewed:</b> ${change.what} on ${change.date} by ${change.by}. ${change.hint}</span><span style="display:flex;gap:8px;flex-wrap:wrap">${canAssignPacks() ? `<button class="btn plain" data-assignpack="${item.id}">Assign pack</button><button class="btn plain" data-packsreviewed="${item.id}">No change needed</button>` : ''}</span></div>` : '';
  }
  function packsCard(item) {
    const assignments = packAssignments(item);
    const where = a => a.item === item.id ? 'This item' : a.item ? `Inherited from ${ITEM[a.item].name}` : `Inherited from ${OUS[a.ou].name} (all items)`;
    return `<section class="card"><div class="card-head"><div><h2>Requirement packs</h2><span class="small muted">Assigned by hand, with a reason: laws and regulations by Regulatory Affairs, standards and procedures by Product Security. Items below inherit them.</span></div>${canAssignPacks() ? `<button class="btn" data-assignpack="${item.id}">Assign pack</button>` : ''}</div>
      ${assignments.length ? `<div class="tablewrap"><table><thead><tr><th>Pack</th><th>Assigned on</th><th>Reason</th><th>By</th></tr></thead><tbody>${assignments.map(a => `<tr><td><b>${a.pack}</b><div class="small muted">${PACKS.find(p => p.n === a.pack).kind}</div></td><td class="small">${where(a)}</td><td class="small">${a.reason}</td><td class="small muted">${a.by}<div>${a.date}</div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No packs yet. This item has no requirements from laws or standards.</div>'}</section>`;
  }
  function item() {
    const i = ITEM[state.itemId] || ITEM['p-neurolink'];
    const reqs = REQS[i.id] || genericReqs(i);
    const related = [i.id, ...ITEMS.filter(x => x.parent === i.id).map(x => x.id)];
    const vulnerabilities = VULNS.filter(v => related.includes(v.item));
    const tabs = ['overview', 'requirements', 'controls', 'engagements', ...(holds(i) ? ['vulnerabilities'] : []), ...(claimSetsFor(i).length ? ['submission'] : []), 'access'];
    const tabNames = { overview: 'Overview', requirements: 'Requirements', controls: 'Controls', engagements: 'Engagements', vulnerabilities: `Vulnerabilities${vulnerabilities.length ? ` <span class="pill p-gray" style="padding:0 6px">${vulnerabilities.length}</span>` : ''}`, submission: claimsTabName(i), access: 'Access' };
    if (!tabs.includes(state.itemTab)) state.itemTab = 'requirements';
    let body = '';
    if (state.itemTab === 'requirements') {
      const filters = ['All', 'Open', 'In progress', 'Met', 'Not applicable', 'Source withdrawn'];
      const srcTypes = ['Pack', 'Policy', 'Threat model', 'Risk assessment', 'Pen test'];
      const shown = reqs.filter(r => state.reqFilter === 'All' || r.st === state.reqFilter || r.src.some(s => s[0] === state.reqFilter));
      const count = s => reqs.filter(r => r.st === s).length;
      body = `${packChangeBanner(i)}<div class="tiles"><div class="tile"><span class="lab">Requirements</span><span class="big">${reqs.length}</span><span class="note">incl. ${reqs.filter(r => r.inh).length} met by inherited controls</span></div><div class="tile"><span class="lab">Met</span><span class="big" style="color:var(--good)">${count('Met')}</span><span class="note">all controls verified</span></div><div class="tile"><span class="lab">In progress</span><span class="big">${count('In progress')}</span><span class="note">controls not yet verified</span></div><div class="tile alert"><span class="lab">Open</span><span class="big">${count('Open')}</span><span class="note">no control yet</span></div></div>
      <div class="chips">${filters.map(f => `<button class="chip ${f === state.reqFilter ? 'on' : ''}" data-req="${f}">${f}</button>`).join('')}<span class="muted small" style="align-self:center;margin-left:6px">Source:</span>${srcTypes.map(f => `<button class="chip ${f === state.reqFilter ? 'on' : ''}" data-req="${f}">${f}</button>`).join('')}</div>
      <section class="card"><div class="tablewrap"><table><thead><tr><th>Requirement</th><th>Sources</th><th>Controls</th><th>Status</th></tr></thead><tbody>${shown.map(r => `<tr><td><b>${r.t}</b>${r.note ? `<div class="small muted">${r.note}</div>` : ''}${r.ac ? `<div class="small"><span class="muted">Acceptance:</span> ${r.ac}</div>` : ''}</td><td>${r.src.map(s => `<div class="small"><span class="tag">${s[0]}</span>${s[1]}</div>`).join('')}</td><td>${r.ctl.length ? r.ctl.map(c => `<span class="tag">${c}</span>`).join('') + (r.inh ? '<div class="small muted">inherited · platform</div>' : '') : '<span class="muted">—</span>'}</td><td>${pill(r.st)}</td></tr>`).join('') || `<tr><td colspan="4" class="empty">No requirements match this filter.</td></tr>`}</tbody></table></div></section>
      <p class="note-box">Status is calculated from the linked controls and approved decisions; nobody sets it by hand. One requirement can come from several laws and standards at once, so one verified control counts for all of them. Requirements from items above (here: the NeuroLink BCI family and the shared device platform) are inherited.</p>
      ${packsCard(i)}`;
    } else if (state.itemTab === 'controls') {
      const cs = CONTROLS[i.id] || [{ n: 'Encrypted storage', addr: 1, st: 'In progress', owner: OUS[i.owner].name, ev: '—' }, { n: 'Clinician identity service MFA', addr: 1, st: 'Verified', owner: 'Identity & Access', ev: 'Inherited from Clinician identity service', inh: true }];
      body = `<section class="card"><div class="card-head"><h2>Controls</h2><button class="btn ghost">Add control</button></div><div class="tablewrap"><table><thead><tr><th>Control</th><th class="num">Addresses</th><th>Status</th><th>Owner</th><th>Evidence</th></tr></thead><tbody>${cs.map(c => `<tr><td><b>${c.n}</b>${c.inh ? ' <span class="pill p-tan">Inherited</span>' : ''}</td><td class="num">${c.addr} req.</td><td>${pill(c.st)}</td><td>${c.owner}</td><td class="small muted">${c.ev}</td></tr>`).join('')}</tbody></table></div></section>
      <p class="note-box">Verification evidence links to design verification records (ISO 13485 7.3.6). A control that changes after verification goes back to “Implemented”.</p>`;
    } else if (state.itemTab === 'engagements') {
      // This item's own engagements, then those on the device or product above it, which cover it too.
      const above = itemAncestors(i).slice(1);
      const es = [...ENGAGEMENTS.filter(e => e.item === i.id), ...ENGAGEMENTS.filter(e => above.includes(e.item))];
      body = `<section class="card"><div class="card-head"><h2>Engagements covering ${i.name}</h2><button class="btn ghost">New engagement</button></div>${es.length ? `<div class="tablewrap"><table><thead><tr><th>Engagement</th><th>Type</th><th>Status</th><th>Next</th></tr></thead><tbody>${es.map(e => `<tr class="click" data-eng="${e.id}"><td><b>${e.name}</b><div class="small muted">${e.date}</div>${e.item !== i.id ? `<div class="small" style="color:var(--accent-dark)">On ${ITEM[e.item].name}, which this item is part of</div>` : ''}</td><td>${e.type}</td><td>${pill(e.status)}</td><td class="small muted">${e.next}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">No engagements yet.</div>`}</section>
      <section class="card"><div class="card-head"><h2>Cadence rules</h2></div><div class="small">Safety ${scLabel(i)}: threat model review every 12 months and at every design change, pen test before each major release, security risk assessment every 12 months. <span class="muted">Rules are set per item type and safety class by the Admin.</span></div></section>`;
    } else if (state.itemTab === 'vulnerabilities') {
      const linkedRisks = v => RISKS.filter(r => r.vul.includes(v.id));
      body = `<section class="card"><div class="card-head"><div><h2>Vulnerabilities</h2><span class="small muted">Pen test findings and supplier advisories on ${i.name}${related.length > 1 ? ' and its software items' : ''}</span></div><button class="btn ghost" data-toast="Advisories are matched against the SBOM of each release. Matches arrive here in triage.">Check advisories</button></div>
        ${vulnerabilities.length ? `<div class="tablewrap"><table><thead><tr><th>Vulnerability</th><th>Source</th><th>Severity (CVSS)</th><th>Analysis</th><th>Threat</th><th>Risk</th><th>Reportable?</th></tr></thead><tbody>${vulnerabilities.map(v => `<tr><td><span class="mono">${v.id}</span> <b>${v.t}</b><div class="small muted">Affects ${v.affects}</div>${v.req ? reqStrip('Creates requirement', v.req) : v.state === 'Not affected' ? '<div class="small muted">No requirement: not affected</div>' : ''}</td><td class="small">${v.test ? `<a href="#eng-${v.test}">${ENGAGEMENTS.find(x => x.id === v.test).name}</a>` : `${v.src}<div class="muted">${v.advisory}</div>`}</td><td>${lvlPill(v.sev)} <span class="mono small">${v.cvss}</span></td><td style="min-width:180px">${vulnAnalysis(v)}</td><td>${v.thr ? threatLink(v.item, v.thr) : '<span class="pill p-warn">Not predicted</span>'}</td><td>${linkedRisks(v).map(r => `<a class="tag" href="#${riskHome(r)}">${r.id}</a>`).join('') || '<span class="muted small">—</span>'}</td><td style="min-width:150px">${reportCell(v)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No known vulnerabilities.</div>'}</section>
      <p class="note-box">Each vulnerability has an analysis state: in triage, exploitable, resolved or not affected. That is the postmarket record FD&amp;C Act 524B(b)(1) and coordinated disclosure (NIST CSF 2.0 ID.RA-08) expect. “Not affected” decisions, with the reason, can be shared with hospitals as a VEX document. An exploitable vulnerability that can lead to a safety damage scenario needs a reportability decision by Regulatory Affairs (FDA postmarket cybersecurity guidance, 21 CFR 806).</p>`;
    } else if (state.itemTab === 'submission') {
      body = claimsTab(i);
    } else if (state.itemTab === 'access') {
      body = `<section class="card"><div class="card-head"><h2>Authorized OUs</h2><button class="btn ghost">Authorize an OU</button></div><div class="tablewrap"><table><thead><tr><th>OU</th><th>Role</th><th>Granted by</th></tr></thead><tbody><tr><td>${ouLabel(i.owner)}</td><td><span class="pill p-prog">Owner</span></td><td class="small muted">Ben Okafor (Product Security, Neurotechnology)</td></tr>${i.contrib.map(c => `<tr><td>${ouLabel(c)}</td><td><span class="pill p-gray">Contributor</span></td><td class="small muted">Ben Okafor (Product Security, Neurotechnology)</td></tr>`).join('')}</tbody></table></div></section>
      <p class="note-box">The owning OU approves the item’s threat models and accepts its risks. Changing the owner needs a Product Security member at an OU that contains both the old and the new owner.</p>`;
    } else {
      body = `<div class="grid g2"><section class="card"><dl class="kv"><dt>Type</dt><dd>${i.type}</dd><dt>Path</dt><dd>${itemPath(i.id)}</dd><dt>Owning OU</dt><dd>${ouPath(i.owner)}</dd><dt>Contributors</dt><dd>${i.contrib.map(c => OUS[c].name).join(', ') || '—'}</dd>${i.cls ? `<dt>Device class</dt><dd>${i.cls}</dd>` : ''}<dt>Software safety class</dt><dd>${scLabel(i)} (IEC 62304)</dd><dt>Cyber device (524B)</dt><dd>${i.cyber ? 'Yes' : 'No'}</dd><dt>Markets</dt><dd>${i.markets.join(', ') || '—'}</dd><dt>Handles PHI</dt><dd>${i.phi ? 'Yes' : 'No'}</dd></dl></section>
      <section class="card"><div class="tiles"><div class="tile"><span class="lab">Threat model</span><span>${tmPill(i)}</span><span class="note">${i.lastTM ? 'last approved ' + i.lastTM : ''}${(() => { const own = threatModelFor(i.id); const fromAbove = !own && itemAncestors(i).slice(1).map(threatModelFor).find(Boolean); return fromAbove ? `<br>via <a href="#eng-${fromAbove.id}">${fromAbove.name}</a>` : ''; })()}</span></div><div class="tile"><span class="lab">Last pen test</span><span class="big" style="font-size:18px">${i.lastPT || '—'}</span></div><div class="tile alert"><span class="lab">Open requirements</span><span class="big">${i.open}</span></div></div></section></div>`;
    }
    return `<div class="small"><a href="#portfolio">Portfolio</a> › ${itemPath(i.id)}</div>
    <div class="page-head"><div><h1>${i.name} <span class="type" style="font-size:13px">${i.type}</span></h1><p class="sub">Owned by ${OUS[i.owner].name} · safety ${scLabel(i)}${i.cls ? ' · ' + i.cls : ''}</p></div>${tmPill(i)}</div>
    <div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" class="${t === state.itemTab ? 'on' : ''}" data-tab="${t}">${tabNames[t]}</button>`).join('')}</div>
    ${body}`;
  }

  function risks() {
    const set = scopeSet(); const rows = RISKS.filter(r => set.has(ITEM[r.item].owner));
    return `<div class="page-head"><div><h1>Risks</h1><p class="sub">An overview of the security risks to every product in scope, for Product Security and management review. Risks are rated and owned in each product’s risk assessment.</p></div></div>
    <section class="card">${!rows.length ? `<div class="empty">No risks in this scope.</div>` : `<div class="tablewrap"><table><thead><tr><th>Risk</th><th>Portfolio item</th><th>Inherent</th><th>Residual</th><th>Target</th><th>Impact from</th><th>Owner</th><th>Status</th><th>Risk assessment</th></tr></thead><tbody>${rows.map(r => `<tr class="click" data-riskgo="${r.id}"><td><span class="mono">${r.id}</span> <b>${r.t}</b></td><td>${ITEM[r.item].name}</td><td>${ratingPill(r.inh)}</td><td>${ratingPill(r.res)}${appetiteBreaches(r).length ? '<div class="small" style="color:var(--bad)">above appetite</div>' : ''}</td><td>${ratingPill(r.tgt)}</td><td>${dsCategoryPills(r.ds)}</td><td class="small">${r.owner}</td><td>${pill(r.st)}${r.pending ? ' ' + pill(r.pending) : ''}</td><td class="small muted">${(riskAssessmentFor(r.item) || {}).name || '—'}</td></tr>`).join('')}</tbody></table></div>`}</section>
    <p class="note-box">Read only. Click a risk to open it in its risk assessment. Risks whose damage scenarios have a safety or health impact are also recorded in the ISO 14971 safety risk file, so safety and security decisions stay in step (AAMI TIR57, AAMI SW96).</p>`;
  }

  function compliance() {
    const items = itemsIn(scopeSet()); const rows = packRows(items);
    return `<div class="page-head"><div><h1>Compliance</h1><p class="sub">Every known requirement in scope, from laws, standards, procedures and engagements, and how many are met.</p></div></div>
    ${!items.length ? emptyScope() : `<div class="tiles"><div class="tile"><span class="lab">All requirements</span><span class="big">${sum(items, 'open') + sum(items, 'prog') + sum(items, 'met')}</span><span class="note">excluding not applicable</span></div><div class="tile"><span class="lab">Met</span><span class="big" style="color:var(--good)">${sum(items, 'met')}</span></div><div class="tile"><span class="lab">In progress</span><span class="big">${sum(items, 'prog')}</span></div><div class="tile alert"><span class="lab">Open</span><span class="big">${sum(items, 'open')}</span></div></div>
    <div class="grid g2"><section class="card"><div class="card-head"><h2>By requirement pack</h2></div><div class="tablewrap"><table><thead><tr><th>Pack</th><th>Met</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${r.p.n}</b><div class="small muted">${assignedSummary(r.p)}</div></td><td style="min-width:160px">${bar(r.m, r.t)}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="card"><div class="card-head"><h2>Most open requirements</h2></div>${itemsTable([...items].sort((a, b) => b.open - a.open).slice(0, 5))}</section></div>
    ${submissionSummary(items)}`}`;
  }

  function libraries() {
    const cards = [

  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>';

  // A person's memberships: the OU path they share is shown once, then one short line per role.
  const ouChain = id => { const chain = []; let current = id; while (current) { chain.unshift(current); current = OUS[current].parent; } return chain; };
  function membershipParts(p) {
    const chains = p.mem.map(m => ouChain(m.ou));
    const shared = [];
    for (let level = 0; chains.every(chain => chain[level] && chain[level] === chains[0][level]); level++) shared.push(chains[0][level]);
    const roles = p.mem.map((m, index) => {
      const rest = chains[index].slice(shared.length).map(id => OUS[id].name).join(' › ');
      return rest ? `${m.fr} ${m.mr} in ${rest}` : `${m.fr} (${m.mr})`;

  // ---------- Router ----------
  function parseHash() {
    const h = (location.hash || (state.signedIn ? '#home' : '#welcome')).slice(1);
    if (h === 'welcome' || h === 'signin') { state.route = h; return; }
    if (!state.signedIn) { state.route = 'welcome'; return; }
    if (h.startsWith('item-')) { const parts = h.slice(5).split('~'); state.route = 'item'; state.itemId = parts[0]; if (parts[1]) { state.itemTab = parts[1]; history.replaceState(null, '', '#item-' + parts[0]); } }
    else if (h.startsWith('eng-')) {
      // eng-<id>, or eng-<id>~<tab>~<threat> to open a workspace tab (used by task links).
      const parts = h.slice(4).split('~'); state.route = 'eng';
      if (state.engId !== parts[0]) { state.engId = parts[0]; state.tmTab = 'overview'; state.tmView = 'component'; state.tmNode = null; state.tmThreat = null; }
      if (parts[1]) { state.tmTab = parts[1]; state.tmView = 'component'; state.tmNode = null; state.tmThreat = parts[1] === 'risk' ? null : parts[2] || null; state.riskId = parts[1] === 'risk' ? parts[2] || null : state.riskId; history.replaceState(null, '', '#eng-' + parts[0]); }
    }
    else state.route = NAV.some(n => n.id === h) ? h : 'home';
    const nav = NAV.find(n => n.id === state.route);
    if (nav && !nav.show()) state.route = 'home';
  }

      v.report = { short: choice === 'report' ? 'Report to FDA' : 'Not reportable', text: texts[choice], reason, by: state.persona.name, date: '23 Nov 2026' };
      closeModal(); render();
      toast(`Decision signed for ${v.id}: ${choice === 'report' ? 'report to the FDA under 21 CFR 806' : 'not reportable'}. The reason is kept with the vulnerability, and the eQMS gets it as a CAPA input.`);
      return;
    }
    if (d.invite) { modal(`<h2>Invite to ${OUS[d.invite].name}</h2><label class="small" for="inv">Work email</label><input type="text" id="inv" value="new.colleague@acme-medical.example"><label class="small" for="mr">Membership role</label><select id="mr" style="font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line)"><option>Contributor</option><option>Viewer</option><option>Lead</option></select><p class="small muted" style="margin:0">Functional role: Engineering. Other roles are given by Product Security or the Admin.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn plain" data-close>Cancel</button><button class="btn" data-close data-sent>Send invitation</button></div>`); return; }
    if (d.test !== undefined) { toast('Entra ID connector: last sync 09:42, 214 users and 12 mapped groups. 2 warnings: users without a mapped group.'); return; }
    if (d.register !== undefined) { modal(`<h2>Register a connector</h2><label class="small" for="cname">Name</label><input type="text" id="cname" value="LDAP connector (Diagnostic Imaging)"><p class="small muted" style="margin:0">Precogly creates a token that can only call the directory API. The connector runs outside Precogly and keeps its own settings.</p><label class="small" for="ctok">Token (shown once)</label><input type="text" id="ctok" class="mono" value="pcg_dir_•••••••••••••7f3a" readonly><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn plain" data-close>Cancel</button><button class="btn" data-close>Register</button></div>`); return; }
    if (d.neweng !== undefined) { modal(`<h2>New engagement</h2><div class="opt" data-close><b>Threat model</b></div><div class="opt" data-close><b>Security risk assessment</b></div><div class="opt" data-close><b>Pen test</b></div><p class="small muted" style="margin:0">Every engagement is scoped to one portfolio item and feeds requirements into it.</p><div style="display:flex;justify-content:flex-end"><button class="btn plain" data-close>Cancel</button></div>`); return; }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo(0, 0); });
  ST['Proposed'] = 'p-tan';
  render();
})();
</script>
</body>
</html>
