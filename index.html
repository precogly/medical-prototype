<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Precogly Medical Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Layout: prototype bar, app header with role-filtered nav, OU scope bar, one content column per screen. */
  /* Light only, on purpose: matches precogly.org and the landing page prototype. */
  :root {
    --page: #FAF8F5; --surface: #FFFFFF; --surface-alt: #F5F0E8; --line: #EAE2D6;
    --ink: #2D2317; --heading: #5C4A36; --muted: #6B5C4C; --tan: #C9A57A;
    --accent: #3B82F6; --accent-dark: #1E4FBF; --accent-tint: #DCE8FD;
    --good: #2E9E62; --good-tint: #DDF2E6; --warn: #B7791F; --warn-tint: #FBEBCB;
    --bad: #C2412D; --bad-tint: #F9E1DC; --gray-tint: #EFEBE4;
    --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  a { color: var(--accent-dark); }
  button { font: inherit; }

  /* Prototype bar */
  .proto { background: var(--ink); color: #F5F0E8; font-size: 13px; }
  .proto-inner { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 8px; }
  .proto-tag { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: var(--tan); color: var(--ink); padding: 2px 8px; border-radius: 4px; }
  .proto select { font: inherit; background: #3d3122; color: #FAF8F5; border: 1px solid #6B5C4C; border-radius: 6px; padding: 4px 8px; }
  .proto .who { color: #E6D5BC; }

  /* Header */
  header.app { background: var(--surface); border-bottom: 1px solid var(--line); }
  .head-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 20px; min-height: 60px; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--heading); font-weight: 700; font-size: 18px; flex: none; }
  .logo img { width: 30px; height: 30px; }
  nav.main { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  nav.main a { white-space: nowrap; text-decoration: none; color: var(--muted); padding: 8px 10px; border-radius: 8px; font-weight: 500; }
  nav.main a:hover { background: var(--surface-alt); color: var(--ink); }
  nav.main a.on { background: var(--accent-tint); color: var(--accent-dark); }
  .head-right { display: flex; align-items: center; gap: 12px; flex: none; }
  .bell { position: relative; background: none; border: 0; cursor: pointer; padding: 6px; color: var(--muted); border-radius: 8px; }
  .bell:hover { background: var(--surface-alt); }
  .bell svg { width: 20px; height: 20px; display: block; }
  .bell .n { position: absolute; top: 0; right: 0; background: var(--bad); color: #fff; font-size: 10px; font-weight: 600; border-radius: 10px; padding: 0 5px; line-height: 16px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-alt); color: var(--heading); display: grid; place-items: center; font-weight: 600; font-size: 12px; border: 1px solid var(--line); }

  /* Scope bar */
  .scope { background: var(--surface-alt); border-bottom: 1px solid var(--line); }
  .scope-inner { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; font-size: 13px; }
  .scope label { color: var(--muted); font-weight: 500; }
  .scope select { font: inherit; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 8px; color: var(--ink); max-width: 100%; }
  .scope .crumbs { color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
  .scope .count { color: var(--muted); font-family: var(--mono); font-size: 12px; }

  main { max-width: 1240px; margin: 0 auto; padding-block: 24px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  h1 { margin: 0; font-size: 24px; line-height: 1.25; color: var(--heading); text-wrap: balance; }
  h2 { margin: 0; font-size: 16px; color: var(--ink); }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
  .tile .lab { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 500; }
  .tile .big { font-size: 28px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .tile .note { color: var(--muted); font-size: 12px; }
  .tile.alert .big { color: var(--bad); }
  .bar { height: 6px; background: var(--gray-tint); border-radius: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--good); }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #FCFAF6; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .mono { font-family: var(--mono); font-size: 12px; }

  .pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .p-good { background: var(--good-tint); color: #1F6E44; }
  .p-prog { background: var(--accent-tint); color: var(--accent-dark); }
  .p-warn { background: var(--warn-tint); color: #7A4F0E; }
  .p-bad { background: var(--bad-tint); color: #8E2A1A; }
  .p-gray { background: var(--gray-tint); color: var(--muted); }
  .p-tan { background: #F3E7D5; color: #6B4E26; }
  .p-priv { background: #EFE8FB; color: #5B2EA6; }
  .req-strip { display: inline-block; margin-top: 5px; background: #F5F0E8; border-radius: 6px; padding: 3px 8px; font-size: 12px; line-height: 1.4; }
  .rec-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
  .rec-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
  .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin: 2px 4px 2px 0; background: var(--surface); white-space: nowrap; }
  .type { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 7px 12px; font-weight: 500; font-size: 13px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff; text-decoration: none; }
  .btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn.ghost { background: var(--surface); color: var(--accent-dark); }
  .btn.ghost:hover { background: var(--accent-tint); }
  .btn.plain { background: var(--surface); color: var(--ink); border-color: var(--line); }
  .btn.plain:hover { background: var(--surface-alt); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--accent-tint); outline-offset: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .chip.on { background: var(--ink); color: var(--page); border-color: var(--ink); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
  .tabs button.on { color: var(--ink); border-color: var(--accent); }

  .list { display: grid; gap: 10px; }
  .row-item { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); flex-wrap: wrap; }
  .row-item .main { min-width: 0; flex: 1 1 320px; display: grid; gap: 4px; }
  .row-item .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .note-box { background: var(--surface-alt); border: 1px dashed var(--tan); border-radius: 10px; padding: 10px 14px; color: var(--heading); font-size: 13px; }
  .req-label { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); background: var(--surface-alt); border-radius: 6px; padding: 2px 8px; }
  .req-label b { color: var(--heading); font-weight: 500; }
  .indent { display: inline-block; }
  .side-layout { display: grid; gap: 20px; grid-template-columns: 220px minmax(0, 1fr); align-items: start; }
  .side-nav { display: grid; gap: 2px; position: sticky; top: 12px; }
  .side-nav button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 500; }
  .side-nav button.on { background: var(--accent-tint); color: var(--accent-dark); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; }
  textarea, input[type=text] { font: inherit; width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 10px; font-size: 13px; max-width: calc(100% - 32px); z-index: 30; box-shadow: 0 8px 24px rgb(45 35 23 / .25); }
  .modal-back { position: fixed; inset: 0; background: rgb(45 35 23 / .35); display: grid; place-items: center; z-index: 20; padding: 16px; }
  .modal { background: var(--surface); border-radius: 14px; max-width: 560px; width: 100%; padding: 20px; display: grid; gap: 14px; max-height: calc(100% - 32px); overflow: auto; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .opt:hover { border-color: var(--accent); background: #F7FAFF; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }

  [hidden] { display: none !important; }
  button.avatar { cursor: pointer; padding: 0; }
  button.avatar:hover { background: var(--accent-tint); }

  /* Landing page (from prototype 01) and sign-in */
  .landing { min-height: calc(100vh - 170px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-block: 40px 24px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
  .brand img { width: 96px; height: 96px; display: block; filter: drop-shadow(0 6px 14px rgb(92 74 54 / 0.18)); }
  .brand .wordmark { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; color: var(--heading); line-height: 1; }
  .landing h1 { margin: 0 0 24px; max-width: 22ch; font-size: clamp(36px, 6vw, 60px); font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; color: var(--heading); }
  .values { list-style: none; margin: 0 0 40px; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 28px; }
  .values li { font-size: clamp(17px, 2.2vw, 20px); font-weight: 600; color: var(--ink); }
  .lp-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .lp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 180px; padding: 12px 24px; border-radius: 8px; font: 500 16px/1.25 var(--font); text-decoration: none; cursor: pointer; border: 1px solid var(--accent); box-sizing: border-box; }
  .lp-btn svg { width: 18px; height: 18px; flex: none; }
  .lp-btn.primary { background: var(--accent); color: #fff; }
  .lp-btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .lp-btn.secondary { background: transparent; color: var(--accent); }
  .lp-btn.secondary:hover { background: var(--accent-tint); }
  .lp-btn.full { width: 100%; }
  .landing .hint { margin: 16px 0 0; font-size: 14px; color: var(--muted); max-width: 44ch; }
  .lp-flow { margin: 32px 0 0; padding: 12px 18px; max-width: 56ch; border: 1px dashed var(--line); border-radius: 8px; font-size: 14px; color: var(--ink); }
  .lp-flow a { color: var(--accent); font-weight: 600; }
  .lp-footer { display: flex; justify-content: center; gap: 20px; padding-block: 20px 8px; border-top: 1px solid var(--line); font-size: 14px; }
  .lp-footer a { color: var(--muted); text-decoration: none; }
  .lp-footer a:hover { color: var(--ink); text-decoration: underline; }
  .signin { display: grid; gap: 20px; grid-template-columns: minmax(0, 400px) minmax(0, 440px); justify-content: center; align-items: start; padding-block: 24px; }
  .signin-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; gap: 12px; }
  .signin-card .brand { margin: 0; gap: 10px; }
  .signin-card .brand img { width: 40px; height: 40px; filter: none; }
  .signin-card .brand .wordmark { font-size: 22px; }
  .signin-card h1 { font-size: 22px; }
  .signin-card label { font-size: 13px; color: var(--muted); }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .demo-card { background: var(--surface-alt); border: 1px dashed var(--tan); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
  .persona-btn { display: grid; gap: 2px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--ink); }
  .persona-btn:hover { border-color: var(--accent); background: #F7FAFF; }
  .persona-btn b { font-weight: 600; }

  /* Threat model workspace */
  .ellipsis { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner-warn { background: var(--warn-tint); border: 1px solid #EBC77F; border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 13px; }
  .review-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
  .check-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; }
  .ok { color: var(--good); font-weight: 700; }
  .dfd-wrap { background-color: var(--surface); background-image: radial-gradient(#E5DCCD 1px, transparent 1px); background-size: 16px 16px; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  .dfd-wrap svg { display: block; width: 100%; min-width: 760px; height: auto; }
  .dfd-wrap.preview svg { min-width: 0; }
  .dfd-node, .dfd-flow { cursor: pointer; }
  .dfd-node:hover rect, .dfd-flow:hover rect { filter: drop-shadow(0 2px 4px rgb(45 35 23 / .2)); }
  .panes { display: grid; grid-template-columns: 260px minmax(0, 1fr) minmax(0, 1.2fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 440px; }
  .pane { border-right: 1px solid var(--line); min-width: 0; }
  .pane:last-child { border-right: 0; }
  .pane-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .pane-head h2 { margin-bottom: 2px; }
  .tree-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 6px; padding-bottom: 6px; padding-right: 10px; margin: 1px 6px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .tree-row:hover { background: var(--surface-alt); }
  .tree-row.on { background: var(--accent-tint); }
  .tree-group { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 10px 4px; }
  .thr-row { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .thr-row:hover { background: #FCFAF6; }
  .thr-row.on { background: #F2F6FE; box-shadow: inset 3px 0 0 var(--accent); }
  .idchip { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--surface); flex: none; }
  .cm-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
  a.tag { text-decoration: none; color: var(--accent-dark); }
  .risk-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  tr.sel td { background: #F2F6FE; }
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); gap: 10px; overflow-x: auto; }
  .board-col { background: var(--surface-alt); border-radius: 10px; padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 160px; }
  .risk-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; display: grid; gap: 4px; font-size: 13px; }
  .risk-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-tint); }
  @media (max-width: 960px) {
    .risk-layout { grid-template-columns: minmax(0, 1fr); }
    .panes { grid-template-columns: minmax(0, 1fr); }
    .pane { border-right: 0; border-bottom: 1px solid var(--line); }
  }

  @media (max-width: 760px) {
    .signin { grid-template-columns: minmax(0, 1fr); }
    .brand img { width: 72px; height: 72px; }
    .brand .wordmark { font-size: 36px; }
    .lp-actions { flex-direction: column; align-self: stretch; }
    .lp-btn { width: 100%; }
    .side-layout { grid-template-columns: 1fr; }
    .side-nav { position: static; grid-auto-flow: column; overflow-x: auto; }
    .logo span { display: none; }
    h1 { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="proto gutter">
  <div class="proto-inner">
    <span class="proto-tag">Prototype</span>
    <label for="persona" id="personaLabel">Viewing as</label>
    <select id="persona"></select>
    <span class="who" id="whoText"></span>
    <span class="who" id="protoHint" hidden>Start on the landing page. Choose Sign-In to pick who you are.</span>
  </div>
</div>

<header class="app gutter">
  <div class="head-inner">
    <a class="logo" href="#home"><img src="precogly-owl.png" alt="" width="30" height="30"><span>Precogly</span></a>
    <nav class="main" id="nav" aria-label="Main"></nav>
    <div class="head-right">
      <button class="bell" id="bell" aria-label="Notifications" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="n" id="bellN" hidden></span></button>
      <button class="avatar" id="avatar" aria-label="Sign out"></button>
    </div>
  </div>
</header>

<div class="scope gutter" id="scopeBar" hidden></div>
<main class="gutter" id="view"></main>
<div class="toast" id="toast" role="status" hidden></div>
<div id="modalRoot"></div>

<script>
(function () {
  // ---------- Sample data (fictional medical device maker) ----------
  const OU_TYPES = [
    { name: 'Division', nest: false }, { name: 'Business unit', nest: false },
    { name: 'Program', nest: true }, { name: 'Team', nest: false }
  ];
  const OUS = {

  }

  const itemAncestors = item => { const chain = []; let current = item; while (current) { chain.push(current.id); current = current.parent ? ITEM[current.parent] : null; } return chain; };
  const packAssignments = item => { const items = itemAncestors(item); const ous = ouChain(item.owner); return PACK_ASSIGNMENTS.filter(a => a.item ? items.includes(a.item) : ous.includes(a.ou)); };

  // Claim sets come with requirement packs. A pack that leads to a submission, certification or audit brings the list of

  const CLAIM_SETS = [
    { id: 'fda', pack: 'FDA premarket cybersecurity guidance', n: 'FDA premarket submission', kind: 'Submission', to: 'FDA', expects: 'One claim per document the FDA expects in a 510(k), De Novo or PMA', action: 'Generate submission package', claims: [
      ['Cybersecurity management plan', '524B(b)(1)', 'postmarket'],
      ['Threat model', 'FDA guidance', 'threatModel'],

      ['Software developed to the state of the art, including information security', 'MDR Annex I 17.2', 'secureDevelopment'],

  function evidenceFor(item) {

    const modelData = models.map(m => TMS[m.id]).filter(Boolean);

    const sbomDone = modelData.reduce((sumSoFar, m) => sumSoFar + sbomCounts(m)[0], 0), sbomTotal = modelData.reduce((sumSoFar, m) => sumSoFar + sbomCounts(m)[1], 0);
    const sbomOverdue = (CONTROLS[item.id] || []).some(c => c.n.startsWith('SBOM') && c.ev.includes('overdue'));

    const vulnerabilities = VULNS.filter(v => related.includes(v.item));

    const development = packRows([item]).find(row => row.p.n === 'IEC 81001-5-1');
    return {
      postmarket: { from: `Coordinated vulnerability disclosure process (inherited)${vulnerabilities.length ? ` · ${vulnerabilities.length} vulnerabilities with an analysis state${triage ? `, ${triage} in triage` : ''}` : ''}`, st: triage ? 'In progress' : 'Ready' },
      threatModel: { from: names(models) || 'No threat model yet', st: models.length ? worst(models.map(readiness)) : 'Not started' },
      architecture: { from: models.length ? 'Diagrams, trust boundaries and data flows in the threat models' : '—', st: models.length ? 'Ready' : 'Not started' },
      riskReport: { from: names(assessments) || 'No risk assessment yet', st: assessments.length ? worst(assessments.map(readiness)) : 'Not started' },
      sbom: { from: sbomTotal ? `${sbomDone} of ${sbomTotal} components linked to an SBOM entry` : '—', st: sbomOverdue ? 'Overdue' : sbomTotal && sbomDone === sbomTotal ? 'Ready' : sbomTotal ? 'In progress' : 'Not started' },
      testing: { from: names(tests) || 'No pen test yet', st: !tests.length || tests.every(t => t.status === 'Planned') ? 'Not started' : openFindings.some(f => f.st === 'Retest pending') ? 'Retest pending' : openFindings.length ? 'Open' : 'Ready' },
      residual: { from: `${openThreats} exposed threat${openThreats === 1 ? '' : 's'}`, st: openThreats ? 'Open' : 'Ready' },
      traceability: { from: models.length ? 'Built from the threat models' : '—', st: models.length ? 'Ready' : 'Not started' },
      labeling: { from: 'Not linked yet', st: 'Not started' },
      secureDevelopment: { from: development ? `IEC 81001-5-1 pack: ${development.m} of ${development.t} requirements met` : 'IEC 81001-5-1 pack not assigned', st: development && development.m === development.t ? 'Ready' : development ? 'In progress' : 'Not started' }
    };
  }
  function claimRows(item, set) { const evidence = evidenceFor(item); return set.claims.map(([d, ref, source]) => ({ d, ref, ...evidence[source] })); }
  const conformance = status => status === 'Ready' ? 'Full' : ['In progress', 'Retest pending', 'Changed since approval'].includes(status) ? 'Partial' : 'None';
  const attestKey = (itemId, setId) => `${itemId}:${setId}`;
  // Certifications (CycloneDX certifications): kept with the claims they support.
  const CERTS = [
    { n: 'ISO 13485:2016 quality management system', issuer: 'Example Registrar Ltd.', ref: 'QMS 712044', valid: '31 Mar 2028', scope: 'Design and manufacture of active implantable devices and their programmers', applies: i => true },
    { n: 'EU MDR certificate (Annex IX)', issuer: 'Example Notified Body', ref: 'MDR 2025-0418', valid: '14 Jun 2030', scope: 'NeuroLink implant system, Class III', applies: i => i.markets.includes('EU') && i.id === 'p-neurolink' }
  ];
  function claimSetCard(item, set) {
    const rows = claimRows(item, set); const ready = rows.filter(s => s.st === 'Ready').length;
    const attestation = state.attested[attestKey(item.id, set.id)];
    const tally = level => rows.filter(s => conformance(s.st) === level).length;
    return `<section class="card"><div class="card-head"><div><h2>${set.n}</h2><span class="small muted">${set.expects} · for: ${set.to} · from the ${set.pack} pack</span></div><span class="pill p-prog">${ready} of ${rows.length} ready</span></div>
    <div class="tablewrap"><table><thead><tr><th>Claim</th><th>Requirement</th><th>Evidence</th><th>Status</th><th>Conformance</th></tr></thead><tbody>${rows.map(s => `<tr><td><b>${s.d}</b></td><td class="small mono">${s.ref}</td><td class="small muted">${s.from}</td><td>${pill(s.st)}</td><td>${pill(conformance(s.st))}</td></tr>`).join('')}</tbody></table></div>
    <div class="review-bar" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><div class="small" style="max-width:70ch">${attestation ? `<b>Attested</b> by ${attestation.by} (Regulatory Affairs) on ${attestation.date}, e-signed: ${tally('Full')} full, ${tally('Partial')} partial and ${tally('None')} with no conformance yet. The attestation is signed into the TM-BOM.` : `<b>Not yet attested.</b> Regulatory Affairs attests to each claim (full, partial or no conformance, with a confidence level) and signs. The signature goes into the TM-BOM with the claims and evidence.`}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${has('Regulatory Affairs') && !attestation ? `<button class="btn plain" data-attest="${item.id}" data-set="${set.id}">Attest and sign</button>` : ''}${has('Regulatory Affairs', 'Product Security') ? `<button class="btn" data-toast="${set.n}: package generated as one signed TM-BOM (CycloneDX) for this device version, plus the PDF documents (prototype: no file).">${set.action}</button>` : ''}</div></div></section>`;
  }
  function claimsTab(item) {
    const certificates = CERTS.filter(c => c.applies(item));
    return `${claimSetsFor(item).map(set => claimSetCard(item, set)).join('')}
    ${certificates.length ? `<section class="card"><div class="card-head"><h2>Certifications</h2><span class="small muted">Linked to the claims they support</span></div><div class="tablewrap"><table><thead><tr><th>Certificate</th><th>Issued by</th><th>Valid until</th><th>Scope</th></tr></thead><tbody>${certificates.map(c => `<tr><td><b>${c.n}</b><div class="small muted mono">${c.ref}</div></td><td class="small">${c.issuer}</td><td class="small">${c.valid}</td><td class="small muted">${c.scope}</td></tr>`).join('')}</tbody></table></div></section>` : ''}
    <p class="note-box">Each list comes with a requirement pack: the FDA premarket guidance pack brings the FDA’s list, the EU MDR pack the notified body’s. A product in another industry gets the lists of its own packs, for example IEC 62443-4-2 certification for an industrial controller, or a DORA review for a bank. Nothing is copied by hand: the evidence comes from signed engagements.</p>`;
  }
  function submissionSummary(items) {
    const rows = items.filter(i => i.type === 'Device').flatMap(i => claimSetsFor(i).map(set => [i, set]));
    if (!rows.length) return '';
    return `<section class="card"><div class="card-head"><h2>Submission readiness</h2><span class="small muted">Devices in scope, one row per submission their packs require</span></div><div class="tablewrap"><table><thead><tr><th>Device</th><th>Submission</th><th>Ready</th><th>Not ready yet</th><th>Attested</th></tr></thead><tbody>${rows.map(([i, set]) => { const claims = claimRows(i, set); const blocking = claims.filter(s => s.st !== 'Ready');
      return `<tr class="click" data-itemtab="submission" data-item="${i.id}"><td><b>${i.name}</b><div class="small muted">${i.cls}</div></td><td>${set.n}<div class="small muted">for ${set.to}</div></td><td style="min-width:140px">${bar(claims.length - blocking.length, claims.length)}</td><td class="small">${blocking.map(s => `${s.d} <span class="muted">(${s.st.toLowerCase()})</span>`).join(', ')}</td><td class="small">${state.attested[attestKey(i.id, set.id)] ? '<span class="pill p-good">Signed</span>' : '<span class="muted">Not yet</span>'}</td></tr>`; }).join('')}</tbody></table></div></section>`;
  }
  function packReviewCard(items) {
    const changed = items.filter(packsToReview);
    if (!changed.length) return '';
    return `<section class="card"><div class="card-head"><div><h2>Packs to review</h2><span class="small muted">Items whose attributes changed since their packs were last reviewed. Precogly does not assign packs by itself.</span></div></div><div class="list">${changed.map(i => `<div class="row-item"><div class="main"><b>${i.name}</b><span class="small">${packsToReview(i).what} on ${packsToReview(i).date} by ${packsToReview(i).by}. ${packsToReview(i).hint}</span></div><div class="acts"><button class="btn plain" data-item="${i.id}" data-itemtab="requirements">Review packs</button></div></div>`).join('')}</div></section>`;
  }
  function reportDecisionCard(items) {
    const scopeItems = new Set(items.map(i => i.id));
    const waiting = VULNS.filter(v => scopeItems.has(v.item) && needsReportDecision(v) && !v.report);
    if (!waiting.length) return '';
    return `<section class="card"><div class="card-head"><div><h2>Reportability decisions</h2><span class="small muted">Exploitable vulnerabilities that can lead to a safety damage scenario. You decide whether each one must be reported to the FDA.</span></div></div><div class="list">${waiting.map(v => `<div class="row-item"><div class="main"><span class="small muted">${v.id} · ${ITEM[v.item].name} · ${lvlPill(v.sev)} CVSS ${v.cvss}</span><b>${v.t}</b><span class="small">Can lead to: ${vulnDamage(v).map(id => DAMAGE[id].n.toLowerCase()).join(', ')}</span></div><div class="acts"><button class="btn" data-reportvuln="${v.id}">Decide</button></div></div>`).join('')}</div></section>`;
  }
  function homeRegulatory() {
    const items = itemsIn(scopeSet());
    const rows = packRows(items);
    return `<div class="page-head"><div><h1>Regulatory overview: ${OUS[state.scope].name}</h1><p class="sub">Requirements from laws, standards and company procedures, with how many are met by verified controls.</p></div></div>
    ${!items.length ? emptyScope() : `${myTasks().length ? `<section class="card"><div class="card-head"><h2>Waiting for you</h2><a href="#tasks" class="small">All tasks</a></div>${taskList(3)}</section>` : ''}${reportDecisionCard(items)}${packReviewCard(items)}${submissionSummary(items)}<section class="card"><div class="card-head"><h2>By requirement pack</h2><a href="#compliance" class="small">Open compliance</a></div><div class="tablewrap"><table><thead><tr><th>Requirement pack</th><th>Assigned to</th><th>Requirements met</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${r.p.n}</b></td><td class="small muted">${assignedSummary(r.p)}</td><td style="min-width:180px">${bar(r.m, r.t)}</td></tr>`).join('')}</tbody></table></div></section>${breakdown(state.scope)}`}`;
  }
  function homePrivacy() {
    const items = itemsIn(scopeSet()).filter(i => i.phi);
    return `<div class="page-head"><div><h1>Privacy overview</h1><p class="sub">Portfolio items that handle protected health information (PHI), and privacy controls waiting for verification.</p></div></div>
    <div class="tiles"><div class="tile"><span class="lab">Items with PHI</span><span class="big">${items.length}</span><span class="note">in scope</span></div><div class="tile"><span class="lab">Verifications waiting</span><span class="big">${myTasks().length}</span><span class="note">privacy controls</span></div><div class="tile"><span class="lab">HIPAA Security Rule met</span><span class="big">${(() => { const r = packRows(items).find(x => x.p.n === 'HIPAA Security Rule'); return r && r.t ? Math.round(r.m / r.t * 100) + '%' : '—'; })()}</span><span class="note">verified controls only</span></div></div>
    <div class="grid g2"><section class="card"><div class="card-head"><h2>Waiting for you</h2></div>${taskList(3)}</section><section class="card"><div class="card-head"><h2>Items with PHI</h2></div>${itemsTable(items)}</section></div>`;
  }
  function homeAdmin() {
    const noLead = OU_ORDER.filter(k => !OUS[k].lead);
    return `<div class="page-head"><div><h1>Setup health</h1><p class="sub">Things that keep the organization structure and access in good shape. Findings are not shown to the Admin role.</p></div></div>
    <div class="tiles"><div class="tile alert"><span class="lab">OUs without a Lead</span><span class="big">${noLead.length}</span><span class="note">${noLead.map(k => OUS[k].name).join(', ')}</span></div><div class="tile"><span class="lab">Users without a membership</span><span class="big">3</span><span class="note">signed in, no OU yet</span></div><div class="tile alert"><span class="lab">Proposals nobody can approve</span><span class="big">1</span><span class="note">Patient data cloud</span></div><div class="tile"><span class="lab">Directory sync</span><span class="big" style="font-size:20px">09:42</span><span class="note">Entra ID connector · 214 users · 2 warnings</span></div></div>
    <section class="card"><div class="card-head"><h2>Escalations</h2><a href="#tasks" class="small">All tasks</a></div>${taskList(3)}</section>`;
  }
  function home() { return { security: homeSecurity, champion: homeChampion, engineering: homeEngineering, regulatory: homeRegulatory, privacy: homePrivacy, admin: homeAdmin }[state.persona.home](); }

  function tasks() {
    const ts = myTasks();
    return `<div class="page-head"><div><h1>My tasks</h1><p class="sub">Proposals waiting for your decision, controls to verify, and work assigned to you. Everything here is across all your OUs.</p></div></div>
    <section class="list">${!ts.length ? `<div class="card empty">No open tasks.</div>` : ts.map(t => `<div class="row-item" id="task-${t.id}"><div class="main"><span class="small muted">${t.kind} · <a href="#item-${t.item}">${itemPath(t.item)}</a></span><b>${t.title}</b><span class="small">${t.detail}</span><span class="small muted">From ${t.by} · ${lvlPill(t.risk)}${t.harm ? ' <span class="pill p-bad">Patient harm possible</span>' : ''} · <span style="color:${t.overdue ? 'var(--bad)' : 'inherit'}">due ${t.due}</span></span></div>
      <div class="acts">${t.link ? `<a class="btn plain" href="#${t.link}">${t.link.includes('changes') ? 'View changes' : t.link.includes('~risk~') ? 'View risk' : 'View threat'}</a>` : ''}${t.kind === 'Approve proposal' || t.kind === 'Sign off' || t.kind === 'Verify control' ? `<button class="btn" data-act="approve" data-t="${t.id}">${t.kind === 'Verify control' ? 'Mark verified' : t.kind === 'Sign off' ? 'Sign off' : 'Approve'}</button><button class="btn plain" data-act="changes" data-t="${t.id}">Request changes</button><button class="btn plain" data-act="reject" data-t="${t.id}">Reject</button>` : t.kind === 'No approver' ? `<a class="btn" href="#admin" data-admin="outree">Fix in OU tree</a>` : t.kind === 'Give input' ? `<button class="btn" data-act="input" data-t="${t.id}">Send input</button>` : `<button class="btn" data-act="done" data-t="${t.id}">Mark done</button>`}</div></div>`).join('')}</section>
    <p class="note-box">The proposer never approves their own proposal. Low and medium risks go to the Security Champion. High and critical risks, and any risk with possible patient harm, go to Product Security at the owning OU or above. Approvals and sign-offs are electronic signatures: they record who, when and what the signature means (21 CFR Part 11).</p>`;
  }

  // How an engagement relates to a set of OUs. It shows for them when its item is theirs, when they contribute to its item,
  // or when it is on the device or product above one of their items (a system threat model covers its components).
  function engagementRelation(e, set) {
    const engagementItem = ITEM[e.item];
    if (set.has(engagementItem.owner)) return { kind: 'owner' };
    if (engagementItem.contrib.some(ou => set.has(ou))) return { kind: 'contributor', text: `Your OU contributes to ${engagementItem.name}` };
    const covered = ITEMS.filter(i => i.id !== e.item && (set.has(i.owner) || i.contrib.some(ou => set.has(ou))) && itemAncestors(i).includes(e.item));
    return covered.length ? { kind: 'covers', text: `Covers your item: ${covered.map(i => i.name).join(', ')}` } : null;
  }
  function engagements() {
    const set = scopeSet(); const types = ['All', 'Threat model', 'Risk assessment', 'Pen test'];
    const rows = ENGAGEMENTS.map(e => ({ e, relation: engagementRelation(e, set) })).filter(({ e, relation }) => relation && (state.engType === 'All' || e.type === state.engType));
    return `<div class="page-head"><div><h1>Engagements</h1><p class="sub">Threat models, security risk assessments and pen tests on the portfolio items in scope, on items your OUs contribute to, and on the devices your items are part of. Each one feeds requirements into its item.</p></div><button class="btn" data-neweng>New engagement</button></div>
    <div class="chips">${types.map(t => `<button class="chip ${t === state.engType ? 'on' : ''}" data-engtype="${t}">${t}</button>`).join('')}</div>
    <section class="card">${!rows.length ? `<div class="empty">No engagements in this scope.</div>` : `<div class="tablewrap"><table><thead><tr><th>Engagement</th><th>Type</th><th>Portfolio item</th><th>Owning OU</th><th>Status</th><th>Next</th></tr></thead><tbody>${rows.map(({ e, relation }) => `<tr class="click" data-eng="${e.id}"><td><b>${e.name}</b><div class="small muted">${e.date}</div></td><td>${e.type}</td><td>${ITEM[e.item].name} <span class="type">${ITEM[e.item].type}</span>${relation.text ? `<div class="small" style="color:var(--accent-dark)">${relation.text}</div>` : ''}</td><td>${OUS[ITEM[e.item].owner].name}</td><td>${pill(e.status)}</td><td class="small muted">${e.next}</td></tr>`).join('')}</tbody></table></div>`}</section>`;
  }

  // ---------- Threat model workspace ----------
  const canPropose = () => has('Engineering', 'Security Champion', 'Product Security');
  const nodeWidth = n => n.kind === 'actor' ? 88 : Math.max(140, n.name.length * 6.6 + 28);
  const nodeHalf = n => n.kind === 'actor' ? [44, 30] : [nodeWidth(n) / 2, 24];
  function tmTargetLabel(tm, target) {
    const node = tm.nodes.find(x => x.id === target);
    if (node) return `${node.name} (${KIND[node.kind]})`;
    const flow = tm.flows.find(x => x.id === target);
    return flow ? `${flow.label} (data flow)` : '';
  }
  const threatsOn = (tm, target) => tm.threats.filter(t => t.target === target);
  const openOn = (tm, target) => threatsOn(tm, target).filter(t => t.st === 'Open').length;

  // Data flow diagram drawn as SVG, view only. highlight: ids of nodes and flows to outline in amber.
  function dfdSvg(tm, highlight) {
    const marked = new Set(highlight || []);
    const nodeById = id => tm.nodes.find(n => n.id === id);
    const edgePoint = (from, to) => {
      const [halfW, halfH] = nodeHalf(from); const dx = to.x - from.x, dy = to.y - from.y;
      const scale = Math.min(dx ? halfW / Math.abs(dx) : Infinity, dy ? halfH / Math.abs(dy) : Infinity);
      return [from.x + dx * scale, from.y + dy * scale];
    };
    const badge = (x, y, total, open) => total ? `<circle cx="${x}" cy="${y}" r="10" fill="${open ? '#C2412D' : '#8A7B6B'}"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">${total}</text>` : '';
    const zones = tm.zones.map(z => `<g><rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="10" fill="#EAF6EE" fill-opacity=".55" stroke="#2E9E62" stroke-dasharray="6 4"/><text x="${z.x + 12}" y="${z.y + 20}" font-size="12" font-weight="600" fill="#1F6E44">${z.name}</text><text x="${z.x + z.w - 12}" y="${z.y + 20}" text-anchor="end" font-size="11" fill="#1F6E44">TL ${z.tl}</text></g>`).join('');
    const flows = tm.flows.map(f => {
      const a = nodeById(f.from), b = nodeById(f.to);
      const [x1, y1] = edgePoint(a, b); const [x2, y2] = edgePoint(b, a);
      const along = f.at || 0.5; const mx = x1 + (x2 - x1) * along, my = y1 + (y2 - y1) * along; const on = marked.has(f.id);
      const total = threatsOn(tm, f.id).length, open = openOn(tm, f.id);
      const labelWidth = f.label.length * 5.9 + 16;
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${on ? '#B7791F' : '#8A7B6B'}" stroke-width="${on ? 2.5 : 1.4}" stroke-dasharray="${on ? '' : '5 4'}" marker-end="url(#arrow${on ? 'On' : ''})"/>
        <g class="dfd-flow" data-dfdnode="${f.id}"><rect x="${mx - labelWidth / 2}" y="${my - 11}" width="${labelWidth}" height="22" rx="6" fill="#fff" stroke="${on ? '#B7791F' : '#EAE2D6'}" stroke-width="${on ? 2 : 1}"/><text x="${mx}" y="${my + 4}" text-anchor="middle" font-size="10.5" fill="#2D2317">${f.label}</text>${badge(mx + labelWidth / 2, my - 11, total, open)}</g>`;
    }).join('');
    const nodes = tm.nodes.map(n => {
      const on = marked.has(n.id); const total = threatsOn(tm, n.id).length, open = openOn(tm, n.id);
      const [halfW, halfH] = nodeHalf(n);
      const stroke = on ? '#B7791F' : null;
      let shape;
      if (n.kind === 'actor') shape = `<rect x="${n.x - halfW}" y="${n.y - halfH}" width="${halfW * 2}" height="${halfH * 2 + 14}" rx="8" fill="#EEF8F1" stroke="${stroke || '#9FD3B3'}"/><circle cx="${n.x}" cy="${n.y - 14}" r="6" fill="none" stroke="#2E9E62" stroke-width="1.6"/><path d="M${n.x} ${n.y - 8} v12 M${n.x - 8} ${n.y - 3} h16 M${n.x} ${n.y + 4} l-7 9 M${n.x} ${n.y + 4} l7 9" stroke="#2E9E62" stroke-width="1.6" fill="none"/><text x="${n.x}" y="${n.y + 30}" text-anchor="middle" font-size="11" fill="#2D2317">${n.name}</text>`;
      else if (n.kind === 'store') shape = `<rect x="${n.x - halfW}" y="${n.y - halfH}" width="${halfW * 2}" height="${halfH * 2}" rx="4" fill="#F4EEFC" stroke="${stroke || '#7C3AED'}" stroke-width="${on ? 2.5 : 1.4}"/><line x1="${n.x - halfW}" y1="${n.y - halfH + 7}" x2="${n.x + halfW}" y2="${n.y - halfH + 7}" stroke="${stroke || '#7C3AED'}"/><text x="${n.x}" y="${n.y + 8}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4C1D95">${n.name}</text>`;
      else if (n.kind === 'external') shape = `<rect x="${n.x - halfW}" y="${n.y - halfH}" width="${halfW * 2}" height="${halfH * 2}" rx="6" fill="#F5F0E8" stroke="${stroke || '#8A7B6B'}" stroke-width="${on ? 2.5 : 1.4}"/><text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2D2317">${n.name}</text>`;
      else shape = `<rect x="${n.x - halfW}" y="${n.y - halfH}" width="${halfW * 2}" height="${halfH * 2}" rx="24" fill="#fff" stroke="${stroke || '#3B82F6'}" stroke-width="${on ? 2.5 : 1.5}"/><text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E4FBF">${n.name}</text>`;
      return `<g class="dfd-node" data-dfdnode="${n.id}">${shape}${badge(n.x + halfW - 6, n.y - halfH, total, open)}${on ? `<text x="${n.x}" y="${n.y + halfH + 14}" text-anchor="middle" font-size="10" font-weight="600" fill="#B7791F">changed since approval</text>` : ''}</g>`;
    }).join('');
    return `<svg viewBox="0 0 1000 600" role="img" aria-label="Data flow diagram" style="font-family:var(--font)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A7B6B"/></marker><marker id="arrowOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B7791F"/></marker></defs>${zones}${flows}${nodes}</svg>`;
  }
  const changedIds = tm => tm.changes ? [...tm.changes.map(c => c.id), ...(tm.changedNodes || [])] : [];

  // Damage scenarios a vulnerability can lead to, through its linked risks and threat.
  const vulnDamage = v => { const fromRisks = RISKS.filter(r => r.vul.includes(v.id)).flatMap(r => r.ds); const threat = v.thr ? Object.values(TMS).flatMap(tm => tm.threats).find(t => t.id === v.thr) : null; return [...new Set([...fromRisks, ...(threat ? threat.ds : [])])]; };
  // Regulatory Affairs decides whether to report an exploitable vulnerability that can lead to a safety damage scenario (FDA postmarket guidance, 21 CFR 806).
  const needsReportDecision = v => v.state === 'Exploitable' && isSafetyRelevant(vulnDamage(v));
  const reportCell = v => v.report ? `<span title="${v.report.reason}">${pill(v.report.short)}</span><div class="small muted">${v.report.text}<br>${v.report.by}, ${v.report.date}</div>` : needsReportDecision(v) ? (has('Regulatory Affairs') ? `<button class="btn plain" data-reportvuln="${v.id}">Decide</button>` : '<span class="pill p-warn">Waiting for Regulatory Affairs</span>') : '<span class="muted small">Not needed</span>';
  // Regulatory Affairs reads signed versions only.
  const signedOnly = () => has('Regulatory Affairs') && !has('Product Security', 'Security Champion', 'Engineering', 'Privacy', 'Admin');
  // The requirement a threat addresses: its statement, the laws and standards behind it (from its countermeasures), and a status.
  function threatRequirement(t) {
    const codes = [...new Set(t.cms.flatMap(c => c.req).filter(code => !code.startsWith('Derived') && !code.startsWith('Pen test') && !code.startsWith('Risk ')))];
    const statement = THREAT_REQUIREMENTS[t.id] || `Mitigate ${t.id}`;
    // A requirement shared by several threats has one status: the one on the item's Requirements tab, when it is listed there.
    const listed = Object.values(REQS).flat().find(r => r.t === statement);
    const status = listed ? listed.st : t.st === 'Accept proposed' ? 'Source withdrawn' : t.cms.length && t.cms.every(c => c.st === 'Verified') ? 'Met' : t.cms.length ? 'In progress' : 'Open';
    return { statement, codes, status };
  }
  const reqStrip = (label, statement, extra) => `<div class="req-strip"><span class="muted">${label}:</span> ${statement}${extra || ''}</div>`;
  function vulnAnalysis(v) {
    const note = v.justification ? `${v.justification}. ${v.detail}` : v.response ? `Response: ${v.response.toLowerCase()}. ${v.detail}` : v.detail;
    return `${pill(v.state)}<div class="small muted">${note}</div>`;
  }
  function engagement() {
    const e = ENGAGEMENTS.find(x => x.id === state.engId) || ENGAGEMENTS[0]; const i = ITEM[e.item];
    if (signedOnly() && e.type !== 'Pen test') return signedEngagement(e, i);
    if (e.type === 'Threat model' && TMS[e.id]) return workspace(e, i);
    if (e.type === 'Risk assessment') return riskAssessmentPage(e, i);
    let body = '';
    if (e.type === 'Pen test') {
      const found = FINDINGS.filter(f => f.test === e.id);
      body = `<section class="card"><div class="card-head"><h2>Findings</h2><span class="small muted">Each finding is a vulnerability on ${i.name} with an analysis state, and creates a requirement</span></div>${e.status === 'Planned' ? '<div class="empty">No findings yet. The test is planned.</div>' : `<div class="tablewrap"><table><thead><tr><th>Finding</th><th>Severity (CVSS)</th><th>Analysis</th><th>Linked threat</th><th>Status</th></tr></thead><tbody>${found.map(f => `<tr><td><span class="mono">${f.id}</span> <b>${f.t}</b><div class="small muted">Affects ${f.affects}</div>${f.req ? reqStrip('Creates requirement', f.req) : ''}</td><td>${lvlPill(f.sev)} <span class="mono small">${f.cvss}</span></td><td>${vulnAnalysis(f)}</td><td>${f.thr ? `${threatLink(e.item, f.thr)} <span class="small muted">predicted by the threat model</span>` : '<span class="pill p-warn">Not predicted</span>'}</td><td>${pill(f.st)}</td></tr>`).join('')}</tbody></table></div>`}</section>
      <p class="note-box">Scores use CVSS v3.1 with the medical device rubric (an FDA-qualified tool). Each finding carries an analysis state (in triage, exploitable, resolved or not affected), the record 524B(b)(1) expects for postmarket vulnerabilities. Links to threats are optional. “Not predicted” findings are feedback for the next threat model review. This test counts as penetration testing under IEC 81001-5-1 §5.7.</p>`;
    }
    return `<div class="small"><a href="#engagements">Engagements</a> › ${e.name}</div>
    <div class="page-head"><div><h1>${e.name}</h1><p class="sub">${e.type} · <a href="#item-${i.id}">${itemPath(i.id)}</a> · owned by ${OUS[i.owner].name}</p></div>${pill(e.status)}</div>
    <section class="card"><dl class="kv"><dt>Scope</dt><dd>${i.name} (${i.type}${i.cls ? ', ' + i.cls : ''})</dd><dt>Dates</dt><dd>${e.date}</dd><dt>Sign-off</dt><dd>${e.status === 'Completed' ? 'E-signed by Ben Okafor (Product Security, Neurotechnology). Meaning: approval' : 'Not yet signed off'}</dd><dt>Snapshot</dt><dd>${e.status === 'Completed' ? 'Kept at sign-off in the design history file, for audit and submission' : '—'}</dd><dt>Next</dt><dd>${e.next}</dd></dl></section>
    ${body}`;
  }

  function workspace(e, i) {
    const tm = TMS[e.id];
    const changed = e.status === 'Changed since approval' && tm.changes;
    if (state.tmTab === 'changes' && !changed) state.tmTab = 'overview';
    const tabs = [['overview', 'Overview'], ...(changed ? [['changes', `Changes since approval <span class="pill p-warn" style="padding:0 6px">${tm.changes.length}</span>`]] : []), ['threats', `Threat Analysis <span class="pill p-bad" style="padding:0 6px">${tm.threats.length}</span>`]];
    const tab = state.tmTab;
    const screens = { overview: wsOverview, changes: wsChanges, threats: wsThreats, diagram: wsDiagram };
    return `<div class="small"><a href="#engagements">Engagements</a> › ${e.name} › Workspace</div>
    <div class="page-head"><div><h1>${e.name}</h1><p class="sub">Threat model · <a href="#item-${i.id}">${itemPath(i.id)}</a> · owned by ${OUS[i.owner].name}</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill(e.status)}<button class="btn plain" data-toast="Share works as today: give people or OUs access to this threat model.">Share</button><button class="btn plain" data-tmexport="${e.id}">Export</button></div></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" class="${k === tab || (tab === 'diagram' && k === 'threats') ? 'on' : ''}" data-tmtab="${k}">${l}</button>`).join('')}</div>
    ${(screens[tab] || wsOverview)(e, i, tm)}`;
  }

  const versionText = tm => tm.ver ? `Version ${tm.ver}, frozen${tm.working ? ` · version ${tm.working} in progress` : ''}` : `Version ${tm.working || 1}, draft`;
  function wsOverview(e, i, tm) {
    const changed = e.status === 'Changed since approval' && tm.changes;
    const components = tm.nodes.filter(n => n.kind !== 'actor').length;
    const withCountermeasure = tm.threats.filter(t => t.cms.length || t.st === 'Accept proposed').length;
    const countermeasures = tm.threats.flatMap(t => t.cms);
    const safetyThreats = tm.threats.filter(t => isSafetyRelevant(t.ds)); const inRiskFile = safetyThreats.filter(t => t.riskFile !== false).length;
    const linkedToRequirement = countermeasures.filter(c => c.req.some(r => !r.startsWith('Derived'))).length;
    const [sbomDone, sbomTotal] = sbomCounts(tm);
    const verified = tm.assumptions.filter(a => a.v === 'Verified').length, invalid = tm.assumptions.filter(a => a.v === 'Invalid').length;
    const check = (label, value, bad) => `<div class="check-row"><span>${bad ? '<span style="color:var(--bad)">!</span>' : '<span class="ok">✓</span>'} ${label}</span><span class="pill ${bad ? 'p-bad' : 'p-gray'}">${value}</span></div>`;
    const meter = (label, done, total) => `<div style="display:grid;gap:4px;margin-bottom:10px"><div class="check-row" style="padding:0"><span>${label}</span><span class="mono">${done}/${total}</span></div><div class="bar"><span style="width:${total ? Math.round(done / total * 100) : 0}%;${done < total ? 'background:var(--warn)' : ''}"></span></div></div>`;
    const packs = PACKS.filter(p => hasPack(p.n, i)).map(p => p.n);
    const reviewButton = has('Security Champion', 'Product Security') && e.status !== 'Approved' ? `<button class="btn plain" data-tmreview="${e.id}">Mark reviewed</button>` : '';
    const approveButton = e.status === 'Approved' ? '<button class="btn plain" disabled>Approved</button>' : `<button class="btn" data-tmapprove="${e.id}" ${has('Product Security') ? '' : 'disabled title="Only Product Security approves threat models with safety-relevant threats"'}>${changed ? 'Sign off changes' : 'Approve'}</button>`;
    const strong = text => `<b style="color:var(--ink);font-weight:500">${text}</b>`;
    return `${changed ? `<div class="banner-warn"><span><b>Changed since approval on 3 June 2026:</b> ${tm.changes.filter(c => c.type === 'Threat').length} threats and ${tm.changes.filter(c => c.type === 'Data flow').length} data flows. Version ${tm.ver} stays frozen.</span><button class="btn plain" data-tmtab="changes">See changes</button></div>` : ''}
    <section class="card"><div class="card-head"><h2>Diagrams and completion</h2></div>
      <div class="grid g2">
        <div><div class="dfd-wrap preview">${dfdSvg(tm, changed ? changedIds(tm) : [])}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap"><span class="small muted">Data flow diagram · ${tm.nodes.length} nodes · ${tm.flows.length} flows</span><button class="btn ghost" data-tmtab="diagram">Open diagram</button></div></div>
        <div>
          <h2 style="margin-bottom:2px">Completion status</h2><p class="small muted" style="margin:0 0 10px">Did we do a good job?</p>
          <div class="small muted" style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">System definition</div>
          ${check('Data assets defined', `${tm.assets} assets`)}${check('Components identified', `${components} components`)}${check('Zones and boundaries identified', `${tm.zones.length} zones`)}${check('Flows defined', `${tm.flows.length} flows`)}${check('Assumptions recorded', `${tm.assumptions.length} · ${verified} verified${invalid ? ` · ${invalid} invalid` : ''}`, invalid)}
          <div class="small muted" style="text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px">Coverage</div>
          ${meter('Threats linked to components and flows', tm.threats.length, tm.threats.length)}${meter('Countermeasures assigned', withCountermeasure, tm.threats.length)}${meter('Countermeasures linked to a requirement', linkedToRequirement, countermeasures.length)}
          <div class="small muted" style="text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px">Medical device checks</div>
          ${meter('Safety-relevant threats in the ISO 14971 risk file', inRiskFile, safetyThreats.length)}${meter('Components linked to an SBOM entry (524B(b)(3))', sbomDone, sbomTotal)}
        </div>
      </div></section>
    <section class="card review-bar"><div style="display:grid;gap:6px"><div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center"><h2>Review</h2>${pill(e.status)}<span class="small muted">${versionText(tm)}</span></div><div style="display:flex;flex-wrap:wrap;gap:4px 16px" class="small muted"><span>Reviewer: ${strong(tm.reviewed || 'Not yet')}</span><span>Approver: ${strong(tm.approvedBy || 'Not yet')}</span><span>Valid until: ${strong(tm.valid || '—')} (review every 12 months)</span></div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${reviewButton}${approveButton}</div></section>
    ${pentestFeedbackCard(e, i, tm)}
    <section class="card"><div class="card-head"><div><h2>Assumptions</h2><span class="small muted">What this threat model takes as true about the device and where it is used</span></div>${canPropose() ? '<button class="btn ghost" data-toast="Add assumption: the statement, its topic, an owner and how it will be checked.">Add assumption</button>' : ''}</div>
      <div class="tablewrap"><table><thead><tr><th>Assumption</th><th>Topic</th><th>Validity</th><th>How it was checked</th></tr></thead><tbody>${tm.assumptions.map(a => `<tr><td>${a.a}</td><td class="small">${a.topic}</td><td>${pill(a.v)}</td><td class="small muted">${a.how}</td></tr>`).join('')}</tbody></table></div>
      ${invalid ? '<p class="small" style="color:var(--bad);margin:10px 0 0">An invalid assumption can hide threats or make them look less likely. Review the threats on the affected flows before the next approval.</p>' : ''}</section>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      <section class="card"><div class="small muted">Device</div><b>${i.name}</b><div class="small muted">${i.cls || i.type} · safety ${scLabel(i)}${i.cyber ? ' · cyber device' : ''}</div></section>
      <section class="card"><div class="small muted">Intended use</div><div class="small">${tm.intended}</div></section>
      <section class="card"><div class="small muted">Use cases</div><b>${tm.useCases} use cases</b><div class="small muted">Linked to threats by use case, as today</div></section>
    </div>
    <section class="card"><div class="card-head"><h2>Connections</h2></div><dl class="kv"><dt>Requirement packs</dt><dd>${packs.join(', ')}</dd><dt>Threat libraries</dt><dd>${tm.libraries}</dd><dt>Taxonomies</dt><dd>Categories: STRIDE, LINDDUN · Weaknesses: CWE · Attack patterns: CAPEC · Techniques: MITRE ATT&amp;CK for ICS, ATLAS, EMB3D</dd><dt>Damage scenarios</dt><dd>${[...new Set(tm.threats.flatMap(t => t.ds))].sort().map(dsPill).join(' ') || '—'}</dd><dt>Portfolio item</dt><dd><a href="#item-${i.id}">${itemPath(i.id)}</a></dd><dt>Risk assessment</dt><dd>${riskAssessmentFor(i.id) ? `<a href="#eng-${riskAssessmentFor(i.id).id}">${riskAssessmentFor(i.id).name}</a>` : 'None yet'}</dd></dl></section>`;
  }

  function wsChanges(e, i, tm) {
    const changeClass = { Added: 'p-prog', Changed: 'p-warn', Removed: 'p-gray' };
    return `<section class="card"><div class="card-head"><h2>Changes since approval on 3 June 2026</h2><span class="small muted">Version ${tm.working} compared with frozen version ${tm.ver}</span></div>
      <div class="tablewrap"><table><thead><tr><th>Type</th><th>Item</th><th>Change</th><th>Detail</th><th>By</th><th>Date</th></tr></thead><tbody>${tm.changes.map(c => {
        const link = c.type === 'Threat' && c.change !== 'Removed' ? `<a href="#" data-tmgo="${c.id}">${c.id}</a> ` : c.type === 'Threat' ? `<span class="mono">${c.id}</span> ` : '';
        return `<tr><td>${c.type}</td><td>${link}<b>${c.what}</b></td><td><span class="pill ${changeClass[c.change]}">${c.change}</span></td><td class="small">${c.detail}</td><td class="small">${c.by}</td><td class="small mono">${c.date}</td></tr>`; }).join('')}</tbody></table></div></section>
    <section class="card"><div class="card-head"><h2>Diagram</h2><span class="small muted">Changed items are outlined in amber</span></div><div class="dfd-wrap">${dfdSvg(tm, changedIds(tm))}</div></section>
    <section class="card review-bar"><div class="small" style="max-width:70ch">Product Security signs off the changes, which freezes version ${tm.working}. The design change is recorded for ISO 13485 7.3.9, and the new threat T-33 can lead to unintended stimulation (a safety damage scenario), so it also goes to the ISO 14971 risk file on sign-off.</div><div>${has('Product Security') ? `<button class="btn" data-tmapprove="${e.id}">Sign off changes</button>` : '<span class="small muted">Only Product Security can sign off.</span>'}</div></section>`;
  }

  function threatDetail(e, tm, selected) {
    const definition = threatDef(selected);
    const tags = [...definition.cat, ...definition.cwe, ...definition.capec, ...(definition.other || [])].map(x => `<span class="tag">${x}</span>`).join('');
    const riskFileNote = isSafetyRelevant(selected.ds) ? (selected.riskFile === false ? '<div class="small" style="color:var(--warn)">Not yet in the ISO 14971 risk file</div>' : '<div class="small muted">In the ISO 14971 risk file</div>') : '';
    const linked = RISKS.filter(r => r.item === e.item && r.thr.includes(selected.id));
    const vulnerabilities = VULNS.filter(v => v.thr === selected.id);
    return `<div style="padding:14px;display:grid;gap:10px">
      <div><span class="idchip">${selected.id}</span> <b>${selected.t}</b><div class="small muted" style="margin-top:4px">On ${tmTargetLabel(tm, selected.target)}</div></div>
      <div class="rec-box"><div class="rec-label">Threat · ${definition.lib} library</div><b>${definition.n}</b><div class="small muted">Origin: ${definition.origin.toLowerCase()}</div><div>${tags}</div></div>
      <div class="rec-box"><div class="rec-label">This scenario</div><dl class="kv" style="margin:0"><dt>Actor</dt><dd>${ACTORS[selected.actor]}</dd><dt>Attack vector</dt><dd>${selected.vector}${selected.access !== 'None' ? ` · needs ${selected.access.toLowerCase()} access` : ''}</dd>${selected.intent ? `<dt>Intent</dt><dd>${selected.intent}</dd>` : ''}<dt>Can lead to</dt><dd>${dsPills(selected.ds)}${riskFileNote}</dd></dl></div>
      ${(() => { const requirement = threatRequirement(selected); return `<div class="rec-box"><div class="rec-label">Addresses requirement</div><b>${requirement.statement}</b><div>${requirement.codes.map(reqTag).join('')}<span class="tag">Threat model ${selected.id}</span></div><div class="small">${pill(requirement.status)} <span class="muted">· on the <a href="#item-${e.item}~requirements">Requirements tab</a> of ${ITEM[e.item].name}</span></div></div>`; })()}
      <div class="small">${linked.length ? linked.map(r => `Risk <a href="#${riskHome(r)}">${r.id}</a> ${ratingPill(r.inh)} → ${ratingPill(r.res)} <span class="muted">· risk owner ${r.owner}</span>`).join('<br>') : '<span class="muted">Not linked to a risk yet</span>'}</div>
      ${vulnerabilities.map(v => `<div class="small">${v.test ? `Confirmed by pen test finding <a href="#eng-${v.test}">${v.id}</a>` : `Related supplier advisory <a href="#item-${v.item}~vulnerabilities">${v.id}</a>`} ${pill(v.state)}</div>`).join('')}
      ${selected.note ? `<p class="note-box" style="margin:0">${selected.note}</p>` : ''}
      ${selected.cms.map(c => `<div class="cm-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${c.n}</b>${pill(c.st)}</div><div class="small muted">${controlCategory(c.n)} control · owner ${c.owner}${c.inh ? ' · inherited from the platform' : ''} · effectiveness: ${controlEffectiveness(c.st).toLowerCase()}</div><div class="small">Satisfies: ${c.req.map(reqTag).join('')}</div><div class="small muted">Evidence: ${c.ev}</div></div>`).join('')}
      ${!selected.cms.length && selected.st === 'Open' ? `<div class="empty" style="padding:12px">No countermeasure yet.</div>${canPropose() ? `<button class="btn" data-mitigate="${selected.id}" style="justify-self:start">Mitigate</button>` : ''}` : ''}
    </div>`;
  }

  function wsThreats(e, i, tm) {
    const toolbar = `<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center"><div class="chips"><button class="chip ${state.tmView === 'component' ? 'on' : ''}" data-tmview="component">Component view</button><button class="chip ${state.tmView === 'table' ? 'on' : ''}" data-tmview="table">Traceability table</button></div><button class="btn plain" data-tmtab="diagram">Diagram</button></div>`;
    if (state.tmView === 'table') {
      return `${toolbar}<section class="card"><div class="card-head"><h2>Traceability: threat › requirement › countermeasure › evidence</h2><button class="btn ghost" data-toast="Traceability matrix exported as CSV (prototype: no file).">Export CSV</button></div>
        ${traceabilityTable(tm, true)}</section>
        <p class="note-box">The FDA premarket guidance asks for traceability between threats, controls and testing. Each threat addresses a requirement, and its countermeasures satisfy it. This table is built from the threat model and stays current; nobody maintains it by hand.</p>`;
    }
    return threatPanes(e, i, tm, toolbar);
  }
  // Threat › damage scenario › countermeasure › requirement › evidence. clickable: rows open the threat.
  function traceabilityTable(tm, clickable) {
    const rows = tm.threats.flatMap(t => t.cms.length ? t.cms.map(c => [t, c]) : [[t, null]]);
    return `<div class="tablewrap"><table><thead><tr><th>Threat</th><th>Damage scenario</th><th>Requirement</th><th>Countermeasure</th><th>Verification evidence</th><th>Status</th></tr></thead><tbody>${rows.map(([t, c]) => `<tr ${clickable ? `class="click" data-tmgo="${t.id}"` : ''}><td><span class="mono">${t.id}</span> <b>${t.t}</b><div class="small muted">${tmTargetLabel(tm, t.target)}</div></td><td>${t.ds.length ? t.ds.map(dsPill).join(' ') : '<span class="muted small">None</span>'}</td><td style="min-width:200px"><span class="small"><b>${threatRequirement(t).statement}</b></span><div>${threatRequirement(t).codes.map(reqTag).join('')}</div></td><td>${c ? `<b>${c.n}</b><div class="small muted">${controlCategory(c.n)}</div>` : '<span class="muted">—</span>'}</td><td class="small muted">${c ? c.ev : t.note || '—'}</td><td>${c ? pill(c.st) : (t.st === 'Open' ? '<span class="pill p-bad">exposed</span>' : pill(t.st))}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function threatPanes(e, i, tm, toolbar) {
    const all = state.tmNode === null;
    const list = all ? tm.threats : threatsOn(tm, state.tmNode);
    const selected = list.find(t => t.id === state.tmThreat) || list[0];
    const treeRow = (id, label, sub, indent) => { const total = id ? threatsOn(tm, id).length : tm.threats.length; const open = id ? openOn(tm, id) : tm.threats.filter(t => t.st === 'Open').length;
      return `<div class="tree-row ${(id || null) === state.tmNode ? 'on' : ''}" data-tmnode="${id || 'all'}" style="padding-left:${10 + indent * 14}px"><span style="min-width:0"><span class="ellipsis">${label}</span>${sub ? `<span class="small muted ellipsis">${sub}</span>` : ''}</span><span style="flex:none;white-space:nowrap">${open ? `<span class="pill p-bad">${open} exposed</span> ` : ''}<span class="small muted">(${total})</span></span></div>`; };
    const tree = `${treeRow(null, '<b>System</b>', `${tm.nodes.length} nodes · ${tm.flows.length} flows`, 0)}
      ${tm.zones.map(z => `<div class="tree-group" style="padding-left:24px">${z.name} · TL ${z.tl}</div>${tm.nodes.filter(n => n.zone === z.id).map(n => treeRow(n.id, n.name, KIND[n.kind], 1)).join('')}`).join('')}
      <div class="tree-group" style="padding-left:24px">Data flows</div>${tm.flows.map(f => treeRow(f.id, f.label, `${tm.nodes.find(n => n.id === f.from).name} → ${tm.nodes.find(n => n.id === f.to).name}`, 1)).join('')}`;
    const threatRows = list.length ? list.map(t => `<div class="thr-row ${selected && t.id === selected.id ? 'on' : ''}" data-tmthreat="${t.id}"><span class="idchip">${t.id}</span><span style="flex:1;min-width:0">${t.t} ${dsCategoryPills(t.ds)}</span>${t.st === 'Open' ? '<span class="pill p-bad">exposed</span>' : pill(t.st)}</div>`).join('') : '<div class="empty">No threats on this element.</div>';
    const detail = !selected ? '<div class="empty">Select a threat</div>' : threatDetail(e, tm, selected);
    return `${toolbar}<div class="panes">
      <div class="pane"><div class="pane-head"><h2>Tree</h2><span class="small muted">${tm.nodes.filter(n => n.kind !== 'actor').length} components, ${tm.zones.length} zones, ${tm.flows.length} flows, ${tm.threats.length} threats</span></div><div style="padding:6px 0">${tree}</div></div>
      <div class="pane"><div class="pane-head" style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><h2>Threats</h2><span class="small muted">${all ? 'Whole system' : tmTargetLabel(tm, state.tmNode)}</span></div><span class="pill p-gray">${list.filter(t => t.st !== 'Mitigated').length} active</span></div>${threatRows}</div>
      <div class="pane"><div class="pane-head"><h2>Threat and countermeasures</h2><span class="small muted">${selected ? 'The scenario, what it can lead to, and the requirements its countermeasures satisfy' : 'Select a threat'}</span></div>${detail}</div>
    </div>`;
  }

  function wsDiagram(e, i, tm) {
    const changed = e.status === 'Changed since approval' && tm.changes;
    const zoneOf = id => tm.zones.find(z => z.id === id);
    const nodeOf = id => tm.nodes.find(n => n.id === id);
    const boundaries = {};
    tm.flows.forEach(f => { const from = nodeOf(f.from).zone, to = nodeOf(f.to).zone; if (from === to) return; const key = [from, to].sort().join('|'); (boundaries[key] = boundaries[key] || []).push(f); });
    const encryptedText = f => f.enc === null ? '<span class="muted small">Not a network flow</span>' : f.enc ? 'Yes' : '<span class="pill p-bad">No</span>';
    const profile = f => { const p = DATA_PROFILES[f.dp]; return `<span class="pill ${p.cls}">${p.n}</span> <span class="small muted">${p.regs}</span>`; };
    return `<section class="card"><div class="card-head"><h2>Data flow diagram</h2><button class="btn plain" data-tmtab="threats">Back to threat analysis</button></div>
      <div class="chips small" style="margin-bottom:10px"><span class="tag">Rounded: component</span><span class="tag">Purple: data store</span><span class="tag">Tan: external system</span><span class="tag">Green box: trust zone with trust level</span><span class="tag">Red badge: threats, some exposed</span>${changed ? '<span class="tag" style="border-color:#B7791F;color:#7A4F0E">Amber: changed since approval</span>' : ''}</div>
      <div class="dfd-wrap">${dfdSvg(tm, changed ? changedIds(tm) : [])}</div>
      <p class="small muted" style="margin:10px 0 0">Click a component or flow to see its threats. View only in this mockup: the diagram editor stays as it is today.</p></section>
    <section class="card"><div class="card-head"><div><h2>Trust boundaries</h2><span class="small muted">What must hold for data to cross from one trust zone to another</span></div></div>
      <div class="tablewrap"><table><thead><tr><th>Boundary</th><th>Flows crossing</th><th>Authentication</th><th>Encryption</th></tr></thead><tbody>${Object.entries(boundaries).map(([key, crossing]) => { const [first, second] = key.split('|').map(zoneOf); const unencrypted = crossing.filter(f => f.enc === false).length;
        return `<tr><td><b>${first.name}</b> <span class="small muted">TL ${first.tl}</span> ↔ <b>${second.name}</b> <span class="small muted">TL ${second.tl}</span></td><td class="small">${crossing.map(f => f.label).join(', ')}</td><td class="small">${[...new Set(crossing.map(f => f.auth))].join(', ')}</td><td>${unencrypted ? `<span class="pill p-bad">${unencrypted} unencrypted</span>` : '<span class="pill p-good">All encrypted</span>'}</td></tr>`; }).join('') || '<tr><td colspan="4" class="empty">No flows cross a trust boundary.</td></tr>'}</tbody></table></div></section>
    <section class="card"><div class="card-head"><h2>Data flows</h2></div>
      <div class="tablewrap"><table><thead><tr><th>Flow</th><th>Protocol</th><th>Encrypted</th><th>Authentication</th><th>Data</th></tr></thead><tbody>${tm.flows.map(f => `<tr class="click" data-dfdnode="${f.id}"><td><b>${f.label}</b><div class="small muted">${nodeOf(f.from).name} → ${nodeOf(f.to).name}</div></td><td class="small">${f.proto}</td><td>${encryptedText(f)}</td><td class="small">${f.auth}</td><td>${profile(f)}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="card"><div class="card-head"><h2>Components</h2><span class="small muted">${sbomCounts(tm)[0]} of ${sbomCounts(tm)[1]} linked to an SBOM entry</span></div>
      <div class="tablewrap"><table><thead><tr><th>Component</th><th>Zone</th><th>IEC 62304 class</th><th>SBOM entry</th><th class="num">Threats</th></tr></thead><tbody>${tm.nodes.filter(n => n.kind !== 'actor').map(n => `<tr class="click" data-dfdnode="${n.id}"><td><b>${n.name}</b> <span class="type">${KIND[n.kind]}</span></td><td class="small">${zoneOf(n.zone).name}</td><td>${n.sc ? `Class ${n.sc}` : '—'}</td><td>${n.sbom === true ? '<span class="pill p-good">Linked</span>' : n.sbom === false ? '<span class="pill p-warn">Missing</span>' : '<span class="muted small">Its own SBOM</span>'}</td><td class="num">${threatsOn(tm, n.id).length}</td></tr>`).join('')}</tbody></table></div>
      <p class="small muted" style="margin:10px 0 0">External systems keep their own SBOM. In the TM-BOM each component links to its SBOM entry, and the safety class is recorded on the component.</p></section>`;
  }

  // ---------- Risk assessment: the risk team's workspace for one product ----------
  // Threat modeling (engineers) finds what can go wrong. The risk assessment (Product Security, risk owners)
  // decides how bad each risk is, who owns it, and whether to reduce or accept it. The Risks page is a read-only roll-up.
  // A risk pairs threat scenarios (which supply the likelihood) with damage scenarios (which supply the impact).
  const LEVEL_ORDER = ['Negligible', 'Low', 'Medium', 'High', 'Critical'];
  const ratingScore = rating => rating ? rating[0] * rating[1] : 0;
  const ratingLevel = rating => { const score = ratingScore(rating); return score >= 20 ? 'Critical' : score >= 12 ? 'High' : score >= 6 ? 'Medium' : score >= 3 ? 'Low' : 'Negligible'; };
  const ratingPill = rating => rating ? lvlPill(ratingLevel(rating)).replace('</span>', ` · ${ratingScore(rating)}</span>`) : '<span class="muted small">Not rated</span>';
  const ratingWords = rating => `Likelihood ${LIKELIHOOD_LEVELS[rating[0] - 1].toLowerCase()} × impact ${IMPACT_LEVELS[rating[1] - 1].toLowerCase()}`;
  const canAssess = () => has('Product Security', 'Security Champion');
  const threatModelFor = item => ENGAGEMENTS.find(x => x.type === 'Threat model' && x.item === item && TMS[x.id]);
  const riskAssessmentFor = item => ENGAGEMENTS.find(x => x.type === 'Risk assessment' && x.item === item);
  const riskHome = r => { const assessment = riskAssessmentFor(r.item); return assessment ? `eng-${assessment.id}~risk~${r.id}` : `item-${r.item}`; };
  const threatLink = (item, id) => { const model = threatModelFor(item); return model && TMS[model.id].threats.some(t => t.id === id) ? `<a class="tag" href="#eng-${model.id}~threats~${id}">${id}</a>` : `<span class="tag">${id}</span>`; };
  const vulnById = id => VULNS.find(v => v.id === id);
  const vulnLink = id => { const v = vulnById(id); return `<a class="tag" title="${v.t}" href="#${v.test ? `eng-${v.test}` : `item-${v.item}~vulnerabilities`}">${id}</a>`; };
  const riskOrigin = r => r.thr.length ? `From threat scenario${r.thr.length > 1 ? 's' : ''} ${r.thr.join(', ')}` : r.vul.length ? `From ${vulnById(r.vul[0]).test ? 'pen test finding' : 'supplier advisory'} ${r.vul[0]}` : 'Added by hand';
  const riskDomains = r => [...new Set(['Security', ...r.ds.flatMap(id => DAMAGE[id].impacts.map(([category]) => category))])];
  // Domains whose appetite the residual risk exceeds. Unrated risks are not checked.
  const appetiteBreaches = r => { if (!r.res) return []; const level = LEVEL_ORDER.indexOf(ratingLevel(r.res)); return APPETITE.domains.filter(a => riskDomains(r).includes(a.d) && level > LEVEL_ORDER.indexOf(a.worst)); };
  // Overall risk: the maximum of the residual ratings (inherent where no residual yet), as the assessment's overallRisk.
  const overallRisk = register => register.reduce((worst, r) => { const level = ratingLevel(r.res || r.inh); return LEVEL_ORDER.indexOf(level) > LEVEL_ORDER.indexOf(worst) ? level : worst; }, 'Negligible');
  function conclusionNow(register) {
    const unrated = register.filter(r => !r.res);
    const above = register.filter(r => appetiteBreaches(r).length);
    const waitingForAcceptance = above.filter(r => r.responses.some(x => x.s === 'Accept'));
    const reasons = [];
    if (unrated.length) reasons.push(`${unrated.map(r => r.id).join(', ')} not rated yet`);
    above.forEach(r => reasons.push(`${r.id} above the ${appetiteBreaches(r).map(a => a.d.toLowerCase()).join(' and ')} appetite${r.responses.some(x => x.s === 'Accept') ? ', acceptance proposed' : r.tgt ? `, target ${ratingLevel(r.tgt).toLowerCase()} after planned responses` : ''}`));
    const verdict = unrated.length || waitingForAcceptance.length ? 'Inconclusive' : above.length ? 'Unacceptable' : 'Acceptable';
    return { verdict, reasons };
  }

  function riskDetail(r) {
    const ratingBox = (label, rating, empty) => `<div class="cm-card"><div class="small muted">${label}</div><div>${ratingPill(rating)}</div><div class="small muted">${rating ? ratingWords(rating) : empty}</div></div>`;
    const breaches = appetiteBreaches(r);
    return `<div class="pane-head"><span class="idchip">${r.id}</span> <b>${r.t}</b></div>
    <div style="padding:14px;display:grid;gap:12px">
      <p class="small" style="margin:0">${r.statement}</p>
      <dl class="kv"><dt>Status</dt><dd>${pill(r.st)}${r.pending ? ' ' + pill(r.pending) : ''}</dd><dt>Risk owner</dt><dd>${r.owner}</dd>
        <dt>Domains</dt><dd>${riskDomains(r).map(x => `<span class="tag">${x}</span>`).join('')}</dd>
        <dt>Impact from</dt><dd>${dsPills(r.ds)}${isSafetyRelevant(r.ds) ? '<div class="small muted">Safety relevant: also in the ISO 14971 risk file</div>' : ''}</dd>
        <dt>Likelihood from</dt><dd>${r.thr.length ? r.thr.map(x => threatLink(r.item, x)).join('') + ' <span class="small muted">threat scenarios</span>' : '<span class="muted small">No threat scenario yet</span>'}</dd>
        ${r.vul.length ? `<dt>Vulnerabilities</dt><dd>${r.vul.map(vulnLink).join('')}</dd>` : ''}
        ${r.reqs.length ? `<dt>Creates requirements</dt><dd class="small">${r.reqs.join('<br>')}</dd>` : ''}
        ${r.review ? `<dt>This review</dt><dd class="small">${r.review}</dd>` : ''}</dl>
